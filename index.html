<title>BookVault V1.0.5</title>
<style>

flow:hidden;margin:10px 0}.progress i{display:block;height:100%;background:var(--accent)}.pillrow,.chips{display:flex;gap:7px;flex-wrap:wrap}.pill,.chip{padding:8px 11px;font-size:12px}.pill.active,.chip.selected,.btn.primary{background:var(--accent);color:#f4faf7;border-color:var(--accent);font-weight:750}.search{display:flex;gap:8px}.input,.select,.textarea{width:100%;padding:13px;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--text);outline:0}.textarea{min-height:110px;resize:vertical}.filters{display:flex;gap:7px;overflow:auto;margin:10px 0;padding-bottom:2px}.toolbar{display:flex;gap:8px;margin:10px 0}.toolbar>*{flex:1}.btn{padding:12px 14px;text-align:center}.list{display:flex;flex-direction:column;gap:9px}.item{width:100%;display:flex;gap:12px;text-align:left;padding:12px;background:var(--panel);border:1px solid var(--line);border-radius:17px;color:var(--text)}.item .details{min-width:0;flex:1}.item h3{margin:0 0 4px;font-size:16px}.item p{margin:3px 0;font-size:12px;color:var(--muted)}.stars{font-size:29px;letter-spacing:1px}.stars button{font-size:29px;border:0;background:none;color:#65766f;padding:0}.stars button.on{color:var(--gold)}.form{display:flex;flex-direction:column;gap:14px}.field label{display:block;font-size:12px;color:#33433d;margin-bottom:7px}.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;background:var(--panel);padding:5px;border-radius:14px}.seg.three{grid-template-columns:repeat(3,1fr)}.seg button{padding:9px 3px;border:0;border-radius:10px;background:transparent;color:var(--muted);font-size:11px}.seg button.sel{background:#bfd5ca;color:var(--text)}.detail{text-align:center}.detail h1{margin:13px 0 3px}.danger{background:#3d7564;color:#dff2e9;border-color:#4f8b77}.bottom{position:fixed;z-index:10;left:0;right:0;bottom:0;background:#f7fbf9dd;backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe /* V1.1 readability: dashboard counters and ownership counts */
.stat-value,
.stat-number,
.counter,
.count,
.summary-value,
.summary-number,
.kpi-value,
.kpi-number,
.badge-count,
.not-owned-count,
[data-stat],
[data-count] {
  color: #000000 !important;
}


/* BookVault 1.2.0: dashboard statistic numbers must be black */
.card.stat b,
.card.stat > b,
.card.stat span + b {
  color: #000000 !important;
  -webkit-text-fill-color: #000000 !important;
}

/* "X Bücher nicht im Besitz" */
.card b {
  color: #000000 !important;
  -webkit-text-fill-color: #000000 !important;
}


/* BookVault 1.1.8: readable dark-green text on mint chips */
.chip,
.chip *,
.pill,
.pill *,
[data-chip-group="genres"],
[data-chip-group="genres"] *,
[data-chip-group="subgenres"],
[data-chip-group="subgenres"] *,
[data-chip-group="tropes"],
[data-chip-group="tropes"] * {
  color: #285f4d !important;
  -webkit-text-fill-color: #285f4d !important;
}


/* BookVault 1.1.9: all unselected input/select/button text must be dark green */
input,
textarea,
select,
button,
option,
.input,
.select,
.select-btn,
.choice,
.choice-btn,
.field input,
.field textarea,
.field select,
.field button,
.chip:not(.selected),
.pill:not(.selected) {
  color: #285f4d !important;
  -webkit-text-fill-color: #285f4d !important;
}

/* Placeholder text */
input::placeholder,
textarea::placeholder {
  color: #5f8174 !important;
  -webkit-text-fill-color: #5f8174 !important;
}

/* Keep selected controls with their dark-green background and white text */
.chip.selected,
.chip.selected *,
.pill.selected,
.pill.selected *,
button.selected,
button.selected * {
  color: #ffffff !important;
  -webkit-text-fill-color: #ffffff !important;
}

.add-trope-btn{margin-top:10px}
/* BookVault 1.1.22: eigenes Trope – In-App-Dialog statt Browser-prompt */
.trope-modal-backdrop{
  position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.28);
  display:flex;align-items:center;justify-content:center;padding:20px;
}
.trope-modal{
  width:min(520px,100%);background:#fff;border:1px solid var(--line);
  border-radius:18px;padding:18px;box-shadow:0 18px 50px rgba(0,0,0,.18);
}
.trope-modal h3{margin:0 0 14px;color:#000}
.trope-modal .field{margin-bottom:12px}
.trope-modal-actions{display:flex;gap:8px;margin-top:14px}
.trope-modal-actions .btn{flex:1}


/* BookVault 1.1.24: sticky selected-tropes bar inside the trope section */
.trope-section{
  position:relative;
}
.trope-selected-bar{
  position:sticky;
  top:8px;
  z-index:25;
  background:#e8f4ee;
  border:1px solid var(--line);
  border-radius:14px;
  padding:10px 12px;
  margin:8px 0 10px;
  box-shadow:0 4px 14px rgba(35,75,55,.10);
}
.trope-selected-title{
  font-size:12px;
  font-weight:700;
  color:#285f4d;
  margin-bottom:7px;
}
.trope-selected-chips{
  display:flex;
  gap:6px;
  overflow-x:auto;
  white-space:nowrap;
  scrollbar-width:thin;
  padding-bottom:2px;
}
.trope-selected-chip{
  flex:0 0 auto;
  border:1px solid #8eb9a8;
  background:#dff2e9;
  color:#285f4d;
  border-radius:999px;
  padding:6px 9px;
  font-size:12px;
  cursor:pointer;
}
.trope-selected-empty{
  font-size:12px;
  color:#5f8174;
}


/* BookVault 1.1.26: Einstellungen – Standard-Schrift dunkelgrün */
#settingsScreen,
.settings-screen,
[data-screen="settings"]{
  color:#285f4d;
}
#settingsScreen label,
#settingsScreen h1,#settingsScreen h2,#settingsScreen h3,
#settingsScreen p,#settingsScreen span,
.settings-screen label,
.settings-screen h1,.settings-screen h2,.settings-screen h3,
.settings-screen p,.settings-screen span,
[data-screen="settings"] label,
[data-screen="settings"] h1,[data-screen="settings"] h2,[data-screen="settings"] h3,
[data-screen="settings"] p,[data-screen="settings"] span{
  color:#285f4d;
}
#settingsScreen .input,#settingsScreen .select,#settingsScreen .textarea,
.settings-screen .input,.settings-screen .select,.settings-screen .textarea,
[data-screen="settings"] .input,[data-screen="settings"] .select,[data-screen="settings"] .textarea{
  color:#285f4d;
}


/* BookVault 1.1.27: Löschbutton behält weiße Schrift */
.settings-screen .delete-all-data-btn,
.settings-screen .delete-all-data-btn span,
#settingsScreen .delete-all-data-btn,
#settingsScreen .delete-all-data-btn span,
[data-screen="settings"] .delete-all-data-btn,
[data-screen="settings"] .delete-all-data-btn span{
  color:#fff !important;
}


/* BookVault 1.1.28: exakt der Button "Alle Daten löschen" */
.settings-screen button.delete-all-data-btn,
main.settings-screen button.delete-all-data-btn,
button.delete-all-data-btn.danger{
  color:#ffffff !important;
  -webkit-text-fill-color:#ffffff !important;
}


/* BookVault 1.1.29: visueller Cover-Streifen in der Reihenansicht */
.series-cover-strip{
  display:flex;
  gap:0;
  overflow-x:auto;
  padding:8px 2px 10px;
  margin:8px 0 14px;
  scrollbar-width:thin;
}
.series-cover-strip .series-cover-item{
  flex:0 0 auto;
  width:72px;
  margin-left:-10px;
  position:relative;
  border:0;
  background:transparent;
  padding:0;
}
.series-cover-strip .series-cover-item:first-child{margin-left:0}
.series-cover-strip .series-cover-item img,
.series-cover-strip .series-cover-placeholder{
  width:72px;
  height:104px;
  border-radius:8px;
  object-fit:cover;
  display:block;
  border:1px solid var(--line);
  background:#edf6f1;
  box-shadow:0 3px 8px rgba(35,75,55,.10);
}
.series-cover-placeholder{
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:6px;
  color:#285f4d;
  font-size:11px;
  font-weight:700;
}
.series-cover-volume{
  position:absolute;
  left:4px;
  bottom:4px;
  background:rgba(255,255,255,.9);
  color:#285f4d;
  border:1px solid var(--line);
  border-radius:999px;
  padding:2px 5px;
  font-size:10px;
  font-weight:700;
}


/* BookVault 1.1.31: Reihennotizen dunkelgrün */
.series-notes{color:#285f4d !important;}


/* BookVault 1.1.33: Cover-Collage in der Reihenübersicht */
.series-overview-covers{
  flex:0 0 auto;
  display:flex;
  align-items:flex-end;
  width:max-content;
  max-width:132px;
  min-height:80px;
  overflow:visible;
  padding:2px 0;
  background:transparent;
  border:0;
  border-radius:0;
}
.series-overview-cover{
  width:54px;
  height:80px;
  object-fit:cover;
  border-radius:6px;
  border:1px solid var(--line);
  box-shadow:0 2px 5px rgba(35,75,55,.12);
  margin-left:-24px;
  background:#fff;
}
.series-overview-cover:first-child{margin-left:0}
.series-overview-placeholder{
  width:54px;
  height:80px;
  border-radius:6px;
  border:1px solid var(--line);
  background:#dff2e9;
  color:#285f4d;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:4px;
  font-size:10px;
  font-weight:700;
  margin-left:-24px;
}
.series-overview-placeholder:first-child{margin-left:0}


/* BookVault 1.1.35: Reihenübersicht dreizeilig */
.series-overview-card{
  display:block;
  width:100%;
  text-align:left;
}
.series-overview-title{
  font-size:18px;
  font-weight:800;
  color:#285f4d;
  margin-bottom:4px;
}
.series-overview-meta{
  font-size:13px;
  color:#5f8174;
  margin-bottom:10px;
}
.series-overview-strip{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:2px 0 4px;
  scrollbar-width:thin;
}
.series-overview-strip .series-overview-book{
  position:relative;
  flex:0 0 auto;
  border:0;
  background:transparent;
  padding:0;
}
.series-overview-strip img,
.series-overview-strip .series-overview-placeholder{
  width:64px;
  height:94px;
  border-radius:7px;
  object-fit:cover;
  display:block;
  border:1px solid var(--line);
  background:#edf6f1;
}
.series-overview-strip .series-overview-placeholder{
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:#285f4d;
  font-size:10px;
  font-weight:700;
  padding:4px;
}
.series-overview-volume{
  position:absolute;
  left:4px;
  bottom:4px;
  background:rgba(255,255,255,.92);
  color:#285f4d;
  border:1px solid var(--line);
  border-radius:999px;
  padding:2px 5px;
  font-size:9px;
  font-weight:700;
}

.library-filter-panel{margin:10px 0 12px}.library-filter-panel details{border-top:1px solid var(--line);padding:8px 0}.library-filter-panel summary{cursor:pointer;font-weight:700;color:#285f4d}.library-filter-options{display:flex;flex-wrap:wrap;gap:7px;padding-top:9px}.library-filter-chip{border:1px solid var(--line);background:#edf6f1;color:#285f4d;border-radius:999px;padding:7px 10px;font-size:12px}.library-filter-chip.selected{background:#285f4d;color:#fff}.active-library-filters{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px}.active-library-filter{flex:0 0 auto;border:1px solid #8eb9a8;background:#dff2e9;color:#285f4d;border-radius:999px;padding:6px 9px;font-size:12px}.library-sort-select{color:#285f4d;background:#edf6f1;border:1px solid var(--line);border-radius:10px;padding:8px}
.search-row{display:flex;gap:8px;align-items:center}
.search-row .input{flex:1}
.filter-subsection{padding:8px 0}
.filter-subsection + .filter-subsection{border-top:1px dashed var(--line);margin-top:8px;padding-top:12px}
.filter-subsection-title{font-weight:700;color:#285f4d;margin-bottom:7px}
.filter-search{margin:8px 0}
.author-filter-list{max-height:240px;overflow:auto;padding-right:2px}

/* BookVault 1.1.39: Werk -> mehrere Ausgaben */
.editions-grid{display:grid;gap:10px}
.edition-card{border:1px solid var(--line);background:#edf6f1;border-radius:14px;padding:12px}
.edition-card.primary-edition{box-shadow:inset 0 0 0 2px #8eb9a8}
.edition-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.edition-title{font-weight:800;color:#285f4d}
.edition-meta{font-size:13px;color:#5f8174;margin-top:4px}
.edition-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.edition-actions .btn{font-size:12px;padding:7px 9px}
.edition-primary-badge{display:inline-block;border-radius:999px;background:#285f4d;color:#fff;padding:3px 7px;font-size:10px;font-weight:700}
.edition-section-title{display:flex;align-items:center;justify-content:space-between;gap:10px}

/* BookVault 1.1.40: alle Dialogfenster auf kleinen Displays scrollbar */
.trope-modal-backdrop{
  position:fixed;
  inset:0;
  overflow-y:auto;
  overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
  padding:20px 12px;
  align-items:flex-start !important;
}
.trope-modal{
  width:min(100%,520px);
  max-height:none !important;
  overflow:visible !important;
  margin:auto;
}
@media (max-height:700px){
  .trope-modal-backdrop{padding-top:10px;padding-bottom:10px}
}


.edition-actions .btn.danger{color:#fff !important}


button.edition-delete-btn,
.edition-actions button.edition-delete-btn,
.edition-card .edition-actions button.edition-delete-btn{
  color:#ffffff !important;
  -webkit-text-fill-color:#ffffff !important;
}


/* BookVault 1.1.46: verbesserte Buchkarten & Schnellnavigation */
.book-card{
  position:relative;
  display:flex;
  gap:12px;
  align-items:flex-start;
  width:100%;
  text-align:left;
}
.book-card-main{
  display:flex;
  gap:12px;
  flex:1;
  min-width:0;
  border:0;
  background:transparent;
  padding:0;
  text-align:left;
  color:inherit;
}
.book-card-info{flex:1;min-width:0}
.book-card-title{font-weight:800;color:#285f4d;margin-bottom:2px}
.book-card-author{font-size:13px;color:#5f8174}
.book-card-series{font-size:12px;color:#5f8174;margin-top:3px}
.book-card-pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.book-card-actions{
  display:flex;
  gap:6px;
  align-items:center;
  margin-left:auto;
}
.book-card-action{
  width:34px;height:34px;border-radius:10px;border:1px solid var(--line);
  background:#edf6f1;color:#285f4d;font-size:16px;
}
.book-card-menu{
  position:absolute;
  right:8px;
  top:42px;
  z-index:40;
  min-width:190px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:12px;
  box-shadow:0 10px 28px rgba(0,0,0,.14);
  padding:6px;
}
.book-card-menu.hidden{display:none}
.book-card-menu button{
  width:100%;
  border:0;
  background:transparent;
  color:#285f4d;
  text-align:left;
  padding:9px 10px;
  border-radius:8px;
}
.book-card-menu button:hover{background:#edf6f1}
.book-card-menu .danger-item{color:#9a2f2f}
.quick-anchor-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}


.book-card-rating{
  display:block;
  margin:3px 0 4px;
  color:#285f4d;
  font-size:14px;
  line-height:1.2;
}

.book-card-cover-column{
  flex:0 0 auto;
  display:flex;
  flex-direction:column;
  align-items:center;
}
.book-card-cover-column .book-card-rating{
  margin-top:5px;
  margin-bottom:0;
  font-size:15px;
  font-weight:700;
  color:#285f4d !important;
  white-space:nowrap;
}

.grid-book-rating,
.book-card-cover-column .book-card-rating{
  display:block !important;
  visibility:visible !important;
  opacity:1 !important;
  color:#285f4d !important;
  -webkit-text-fill-color:#285f4d !important;
  font-size:16px !important;
  font-weight:800 !important;
  line-height:1.3 !important;
  letter-spacing:1px;
  margin:5px 0 2px !important;
  min-height:21px;
}


.detail-cover-rating{
  display:flex;
  flex-direction:column;
  align-items:center;
  width:max-content;
  max-width:100%;
  margin:0 auto;
}
.detail-rating{
  display:block !important;
  visibility:visible !important;
  opacity:1 !important;
  margin-top:7px;
  color:#285f4d !important;
  -webkit-text-fill-color:#285f4d !important;
  font-size:18px;
  font-weight:800;
  line-height:1.2;
  letter-spacing:1px;
  white-space:nowrap;
}

/* BookVault 1.1.51: Lesbarkeit Home + Aktionsmeldungen */
.hero h3,
.hero h3 *{
  color:#285f4d !important;
  -webkit-text-fill-color:#285f4d !important;
}
#toast,
#toast *{
  color:#285f4d !important;
  -webkit-text-fill-color:#285f4d !important;
}


/* BookVault 1.1.52: Wunschliste */
.wishlist-tabs{display:flex;gap:8px;overflow-x:auto;margin:10px 0 14px}
.wishlist-tab{border:1px solid var(--line);background:#edf6f1;color:#285f4d;border-radius:999px;padding:8px 12px;white-space:nowrap}
.wishlist-tab.active{background:#285f4d;color:#fff}
.wishlist-card{display:flex;gap:12px;align-items:flex-start}
.wishlist-info{flex:1;min-width:0}
.wishlist-title{font-weight:800;color:#285f4d}
.wishlist-meta{font-size:13px;color:#5f8174;margin-top:3px}
.wishlist-priority{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:3px 7px;font-size:11px;color:#285f4d;background:#dff2e9;margin-top:6px}

function getBooks(){let a=data.books.slice(),q=state.query.trim().toLowerCase(),f=af();if(state.filter==="owned")a=a.filter(b=>b.ownership==="owned");if(state.filter==="borrowed")a=a.filter(b=>b.ownership==="borrowed");if(state.filter==="ku")a=a.filter(b=>b.ownership==="kindleUnlimited");if(state.filter==="wanted")a=a.filter(function(b){migrateBookEditions(b);return b.editions.some(function(e){return e.purchaseStatus==="wanted";});});if(state.filter==="favorites")a=a.filter(b=>b.favorite===true);if(["read","unread","reading","dnf"].includes(state.filter))a=a.filter(b=>b.status===state.filter);if(q)a=a.filter(b=>[b.title,b.author,b.seriesName,(b.genres||[]).join(" "),(b.subgenres||[]).join(" "),(b.tropes||[]).join(" ")].join(" ").toLowerCase().includes(q));if(f.genres.length)a=a.filter(b=>f.genres.every(x=>(b.genres||[]).includes(x)));if(f.subgenres.length)a=a.filter(b=>f.subgenres.every(x=>(b.subgenres||[]).includes(x)));if(f.tropes.length)a=a.filter(b=>f.tropes.every(x=>(b.tropes||[]).includes(x)));if(f.statuses.length)a=a.filter(b=>f.statuses.includes(b.status));if(f.ownership.length)a=a.filter(b=>f.ownership.includes(b.ownership));if(f.formats.length)a=a.filter(b=>f.formats.includes(b.format));if(f.languages.length)a=a.filter(b=>f.languages.includes(b.language));if(f.authors.length)a=a.filter(b=>f.authors.includes(b.author));if(f.seriesType.length)a=a.filter(b=>(f.seriesType.includes("series")&&!!(b.seriesId||b.seriesName))||(f.seriesType.includes("standalone")&&!(b.seriesId||b.seriesName)));if(f.ratingMin)a=a.filter(b=>(Number(b.rating)||0)>=Number(f.ratingMin));a.sort(function(x,y){

function cycleBookStatusById(id){
  const b=data.books.find(function(x){return x.id===id;});if(!b)return;
  const vals=["unread","reading","read","dnf"];
  const i=vals.indexOf(b.status);
  b.status=vals[(i+1)%vals.length];
  b.updatedAt=new Date().toISOString();
  save();render();toast("Lesestatus: "+status(b.status));
}
function toggleBookFavoriteById(id){
  const b=data.books.find(function(x){return x.id===id;});if(!b)return;
  b.favorite=!b.favorite;b.updatedAt=new Date().toISOString();save();render();toast(b.favorite?"Als Favorit markiert":"Favorit entfernt");
}
function cycleBookPurchaseById(id){
  const b=data.books.find(function(x){return x.id===id;});if(!b)return;
  migrateBookEditions(b);const e=primaryEdition(b);if(!e)return;
  if(e.purchaseStatus==="none"){e.purchaseStatus="wanted";}
  else if(e.purchaseStatus==="wanted"){e.purchaseStatus="purchased";e.ownership="owned";}
  else{e.purchaseStatus="none";}
  syncLegacyFromPrimaryEdition(b);save();render();toast("Kaufstatus geändert");
}

function cleanIsbn(v){return String(v||"").replace(/[^0-9Xx]/g,"").toUpperCase();}

function normalizeOlAuthorName(a){if(!a)return "";if(typeof a==="string")return a;return a.name||a.fuller_name||"";}
function normalizeOlPublisher(p){if(!p)return "";if(typeof p==="string")return p;return p.name||"";}
function extractOpenLibraryRecord(payload,isbn){
  const records=payload&&payload.records&&typeof payload.records==="object"?payload.records:null;
  if(!records)return null;
  const keys=Object.keys(records);if(!keys.length)return null;
  const rec=records[keys[0]]||{},d=rec.data||{},ids=d.identifiers||{};
  const isbns=[].concat(rec.isbns||[],ids.isbn_13||[],ids.isbn_10||[]).map(cleanIsbn).filter(Boolean);
  const isbn13=isbns.find(x=>x.length===13)||(isbn.length===13?isbn:"");
  const isbn10=isbns.find(x=>x.length===10)||(isbn.length===10?isbn:"");
  const authors=(d.authors||[]).map(normalizeOlAuthorName).filter(Boolean);
  const publishers=(d.publishers||[]).map(normalizeOlPublisher).filter(Boolean);
  const publishDate=d.publish_date||((rec.publishDates||[])[0])||"";
  const yearMatch=String(publishDate).match(/\b(1[5-9]\d{2}|20\d{2}|21\d{2})\b/);
  let coverUrl="";
  if(d.cover)coverUrl=d.cover.large||d.cover.medium||d.cover.small||"";
  if(!coverUrl){const ci=isbn13||isbn10||isbn;if(ci)coverUrl="https://covers.openlibrary.org/b/isbn/"+encodeURIComponent(ci)+"-L.jpg?default=false";}
  let language="";
  if(Array.isArray(d.languages)&&d.languages.length){
    const key=(d.languages[0].key||"").split("/").pop();
    language={ger:"Deutsch",deu:"Deutsch",eng:"Englisch",fre:"Französisch",fra:"Französisch",spa:"Spanisch"}[key]||"";
  }
  return {title:d.title||"",subtitle:d.subtitle||"",author:authors.map(normalizeAuthorDisplay).join(", "),publisher:publishers.join(", "),publicationYear:yearMatch?yearMatch[1]:"",pageCount:d.number_of_pages||"",language:language,isbn10:isbn10,isbn13:isbn13,cover:coverUrl,format:"",source:"Open Library"};
}



function normalizeAuthorDisplay(name){
  const s=String(name||"").trim();
  if(!s)return "";
  // DNB/MARC often returns personal names as "Nachname, Vorname".
  // Convert only simple personal-name forms; leave corporate names / complex strings untouched.
  const parts=s.split(",");
  if(parts.length===2){
    const last=parts[0].trim();
    const first=parts[1].trim().replace(/[.;:]$/,"");
    if(last && first && !/\b(Verlag|Universität|Institut|Gesellschaft|Stiftung|GmbH|AG)\b/i.test(s)){
      return (first+" "+last).replace(/\s+/g," ").trim();
    }
  }
  return s.replace(/[.;:]$/,"").trim();
}

function dnbSubfield(record,tag,code){
  const fields=[].slice.call(record.querySelectorAll('datafield[tag="'+tag+'"]'));
  for(const f of fields){
    const sf=f.querySelector('subfield[code="'+code+'"]');
    if(sf&&sf.textContent.trim())return sf.textContent.trim();
  }
  return "";
}
function dnbSubfields(record,tag,code){
  return [].slice.call(record.querySelectorAll('datafield[tag="'+tag+'"] subfield[code="'+code+'"]'))
    .map(function(x){return x.textContent.trim();}).filter(Boolean);
}
function cleanMarcText(v){
  return String(v||"").replace(/\s*[\/:;,]\s*$/,"").trim();
}
function extractDnbRecord(xmlText,isbn){
  const doc=new DOMParser().parseFromString(xmlText,"application/xml");
  if(doc.querySelector("parsererror"))throw new Error("DNB XML konnte nicht gelesen werden");
  const rec=doc.querySelector("record recordData record, recordData record")||doc.querySelector("recordData");
  let marc=rec;
  if(rec&&rec.querySelector)marc=rec.querySelector("record")||rec;
  if(!marc)return null;

  let title=cleanMarcText(dnbSubfield(marc,"245","a"));
  let subtitle=cleanMarcText(dnbSubfield(marc,"245","b"));
  const responsibility=cleanMarcText(dnbSubfield(marc,"245","c"));

  let authors=dnbSubfields(marc,"100","a");
  if(!authors.length)authors=dnbSubfields(marc,"700","a");
  authors=authors.map(function(a){return normalizeAuthorDisplay(cleanMarcText(a));});

  let publisher=cleanMarcText(dnbSubfield(marc,"264","b")||dnbSubfield(marc,"260","b"));
  let yearText=cleanMarcText(dnbSubfield(marc,"264","c")||dnbSubfield(marc,"260","c"));
  const ym=yearText.match(/\b(1[5-9]\d{2}|20\d{2}|21\d{2})\b/);

  const extent=dnbSubfield(marc,"300","a");
  const pm=String(extent||"").match(/(\d{1,5})\s*(?:Seiten|S\.|pages|p\.)/i);

  const mediaType=(dnbSubfields(marc,"337","a").join(" ")+" "+dnbSubfields(marc,"337","b").join(" ")).toLowerCase();
  const carrierType=(dnbSubfields(marc,"338","a").join(" ")+" "+dnbSubfields(marc,"338","b").join(" ")).toLowerCase();
  const digitalType=(dnbSubfields(marc,"347","a").join(" ")+" "+dnbSubfields(marc,"347","b").join(" ")).toLowerCase();
  const physicalDesc=String(extent||"").toLowerCase();
  let format="";
  if(/online|computer|electronic|elektron|resource|cr|remote|digital/.test(mediaType+" "+carrierType+" "+digitalType)){
    format="E-Book";
  }else if(/audio|spoken|hörbuch|sound|sd/.test(mediaType+" "+carrierType+" "+physicalDesc)){
    format="Hörbuch";
  }else if(/hardcover|gebunden|fester einband|hardback/.test(physicalDesc)){
    format="Hardcover";
  }else if(/taschenbuch|paperback|broschur|softcover/.test(physicalDesc)){
    format="Taschenbuch";
  }else if(/volume|band|seiten|s\./.test(physicalDesc) || /unmediated|ohne hilfsmittel|nc/.test(mediaType+" "+carrierType)){
    format="Taschenbuch";
  }

  const isbnVals=dnbSubfields(marc,"020","a").map(cleanIsbn).filter(Boolean);
  const cleaned=cleanIsbn(isbn);
  const isbn13=isbnVals.find(function(x){return x.length===13;})||(cleaned.length===13?cleaned:"");
  const isbn10=isbnVals.find(function(x){return x.length===10;})||(cleaned.length===10?cleaned:"");

  const langCode=(marc.querySelector('controlfield[tag="008"]')?.textContent||"").slice(35,38).trim() || dnbSubfield(marc,"041","a");
  const language={ger:"Deutsch",deu:"Deutsch",eng:"Englisch",fre:"Französisch",fra:"Französisch",spa:"Spanisch"}[String(langCode).slice(0,3)]||"";

  const coverIsbn=isbn13||isbn10||cleaned;
  const cover=coverIsbn?"https://covers.openlibrary.org/b/isbn/"+encodeURIComponent(coverIsbn)+"-L.jpg?default=false":"";

  if(!title)return null;
  return {
    title:title,
    subtitle:subtitle,
    author:authors.join(", ")||responsibility,
    publisher:publisher,
    publicationYear:ym?ym[1]:"",
    pageCount:pm?pm[1]:"",
    language:language,
    isbn10:isbn10,
    isbn13:isbn13,
    cover:cover,
    format:format,
    source:"Deutsche Nationalbibliothek"
  };
}
function fetchDnbIsbn(isbn){
  const q='num="'+cleanIsbn(isbn)+'"';
  const url="https://services.dnb.de/sru/dnb?version=1.1&operation=searchRetrieve&query="+
    encodeURIComponent(q)+"&recordSchema=MARC21-xml&maximumRecords=5";
  return fetch(url,{method:"GET",headers:{"Accept":"application/xml,text/xml;q=0.9,*/*;q=0.8"}}).then(function(r){
    if(!r.ok)throw new Error("DNB HTTP "+r.status);
    return r.text();
  });
}

function extractOpenLibrarySearchRecord(payload,isbn){
  const docs=payload&&Array.isArray(payload.docs)?payload.docs:[];
  if(!docs.length)return null;
  const cleaned=cleanIsbn(isbn);
  let d=docs.find(function(doc){return (doc.isbn||[]).map(cleanIsbn).includes(cleaned);})||docs[0];
  const isbns=(d.isbn||[]).map(cleanIsbn).filter(Boolean);
  const isbn13=isbns.find(function(x){return x.length===13;})||(cleaned.length===13?cleaned:"");
  const isbn10=isbns.find(function(x){return x.length===10;})||(cleaned.length===10?cleaned:"");
  let language="";
  const lang=(d.language||[])[0]||"";
  language={ger:"Deutsch",deu:"Deutsch",eng:"Englisch",fre:"Französisch",fra:"Französisch",spa:"Spanisch"}[lang]||"";
  let cover="";
  if(d.cover_i)cover="https://covers.openlibrary.org/b/id/"+encodeURIComponent(d.cover_i)+"-L.jpg";
  else if(isbn13||isbn10)cover="https://covers.openlibrary.org/b/isbn/"+encodeURIComponent(isbn13||isbn10)+"-L.jpg?default=false";
  let year="";
  const pd=(d.publish_date||[])[0]||d.first_publish_year||"";
  const ym=String(pd).match(/\b(1[5-9]\d{2}|20\d{2}|21\d{2})\b/);
  if(ym)year=ym[1];
  return {
    title:d.title||"",
    subtitle:d.subtitle||"",
    author:Array.isArray(d.author_name)?d.author_name.map(normalizeAuthorDisplay).join(", "):"",
    publisher:Array.isArray(d.publisher)?d.publisher[0]||"":d.publisher||"",
    publicationYear:year,
    pageCount:d.number_of_pages_median||"",
    language:language,
    isbn10:isbn10,
    isbn13:isbn13,
    cover:cover,
    format:"",
    source:"Open Library Search"
  };
}
function fetchOpenLibrarySearchIsbn(isbn){
  const url="https://openlibrary.org/search.json?isbn="+encodeURIComponent(isbn)+
    "&fields=key,title,subtitle,author_name,publisher,publish_date,first_publish_year,number_of_pages_median,isbn,language,cover_i&limit=5";
  return fetch(url,{method:"GET",headers:{"Accept":"application/json"}}).then(function(r){
    if(!r.ok)throw new Error("Open Library Search HTTP "+r.status);
    return r.json();
  });
}
function jsonpOpenLibrarySearchIsbn(isbn){
  return new Promise(function(resolve,reject){
    const cb="bookvaultOlSearch_"+Date.now()+"_"+Math.random().toString(36).slice(2);
    const script=document.createElement("script");
    const timer=setTimeout(function(){cleanup();reject(new Error("Open Library Search Zeitüberschreitung"));},10000);
    function cleanup(){
      clearTimeout(timer);
      try{delete window[cb];}catch(_){window[cb]=undefined;}
      if(script.parentNode)script.parentNode.removeChild(script);
    }
    window[cb]=function(data){cleanup();resolve(data);};
    script.onerror=function(){cleanup();reject(new Error("Open Library Search nicht erreichbar"));};
    script.src="https://openlibrary.org/search.json?isbn="+encodeURIComponent(isbn)+
      "&fields=key,title,subtitle,author_name,publisher,publish_date,first_publish_year,number_of_pages_median,isbn,language,cover_i&limit=5&callback="+encodeURIComponent(cb);
    document.head.appendChild(script);
  });
}

function fetchOpenLibraryIsbn(isbn){
  const url="https://openlibrary.org/api/volumes/brief/isbn/"+encodeURIComponent(isbn)+".json";
  return fetch(url,{headers:{"Accept":"application/json"}}).then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.json();});
}
function jsonpOpenLibraryIsbn(isbn){
  return new Promise(function(resolve,reject){
    const cb="bookvaultOl_"+Date.now()+"_"+Math.random().toString(36).slice(2),script=document.createElement("script");
    const timer=setTimeout(()=>{cleanup();reject(new Error("Zeitüberschreitung"));},10000);
    function cleanup(){clearTimeout(timer);try{delete window[cb];}catch(_){window[cb]=undefined;}if(script.parentNode)script.parentNode.removeChild(script);}
    window[cb]=data=>{cleanup();resolve(data);};
    script.onerror=()=>{cleanup();reject(new Error("Open Library nicht erreichbar"));};
    script.src="https://openlibrary.org/api/volumes/brief/isbn/"+encodeURIComponent(isbn)+".json?callback="+encodeURIComponent(cb);
    document.head.appendChild(script);
  });
}
async function lookupIsbn(){
  const isbn=cleanIsbn(document.getElementById("isbnLookup")?.value||document.getElementById("isbn13")?.value||document.getElementById("isbn10")?.value);
  if(!(isbn.length===10||isbn.length===13)){
    isbnStatus("Bitte eine gültige ISBN-10 oder ISBN-13 eingeben.",true);
    return;
  }

  isbnStatus("Suche läuft …",false);
  const btn=document.getElementById("isbnSearchBtn");
  if(btn)btn.disabled=true;

  try{
    let result=null;

    // 1. Deutsche Nationalbibliothek – besonders relevant für deutsche Ausgaben.
    try{
      const dnbXml=await fetchDnbIsbn(isbn);
      result=extractDnbRecord(dnbXml,isbn);
    }catch(err){
      console.warn("DNB ISBN-Suche fehlgeschlagen:",err);
    }

    // 2. Open Library Search API.
    if(!result||!result.title){
      try{
        let op;
        try{op=await fetchOpenLibrarySearchIsbn(isbn);}
        catch(_){op=await jsonpOpenLibrarySearchIsbn(isbn);}
        result=extractOpenLibrarySearchRecord(op,isbn);
      }catch(err){
        console.warn("Open Library Search ISBN-Suche fehlgeschlagen:",err);
      }
    }

    // 3. Open Library Legacy API.
    if(!result||!result.title){
      try{
        let lp;
        try{lp=await fetchOpenLibraryIsbn(isbn);}
        catch(_){lp=await jsonpOpenLibraryIsbn(isbn);}
        result=extractOpenLibraryRecord(lp,isbn);
      }catch(err){
        console.warn("Open Library Legacy ISBN-Suche fehlgeschlagen:",err);
      }
    }

    if(!result||!result.title){
      isbnStatus("Zu dieser ISBN wurden weder bei der Deutschen Nationalbibliothek noch bei Open Library Buchdaten gefunden.",true);
      return;
    }

    setInputValue("title",result.title);
    setInputValue("subtitle",result.subtitle);
    setInputValue("author",result.author);
    setInputValue("publisher",result.publisher);
    setInputValue("publicationYear",result.publicationYear);
    setInputValue("pageCount",result.pageCount);
    setInputValue("language",result.language);
    setInputValue("isbn10",result.isbn10);
    setInputValue("isbn13",result.isbn13);
    setInputValue("cover",result.cover);
    setInputValue("format",result.format);

    const preview=document.getElementById("preview");
    if(preview&&result.cover){
      preview.innerHTML='<img src="'+esc(result.cover)+'" style="width:75px;height:110px;object-fit:cover;border-radius:9px" onerror="this.style.display=\'none\'">';
    }

    isbnStatus("Buchdaten über "+(result.source||"Buchdatenbank")+" gefunden und ins Formular übernommen. Bitte vor dem Speichern prüfen.",false);
    toast("ISBN-Daten übernommen");
  }catch(err){
    console.error("ISBN lookup:",err);
    isbnStatus("ISBN-Suche fehlgeschlagen. Internetverbindung prüfen.",true);
  }finally{
    if(btn)btn.disabled=false;
  }
}

function refreshSubgenreChoices(){
  const field=document.getElementById("subgenreField");
  const selectedGenres=[].slice.call(document.querySelectorAll('[data-chip-group="genres"].selected'))
    .map(el=>el.getAttribute("data-chip-value"));
  const allowed=[...new Set(selectedGenres.flatMap(g=>data.subgenres[g]||[]))];
  const selectedSubgenres=[].slice.call(document.querySelectorAll('[data-chip-group="subgenres"].selected'))
    .map(el=>el.getAttribute("data-chip-value"))
    .filter(x=>allowed.indexOf(x)>=0);

  if(!allowed.length){
    if(field)field.remove();
    return;
  }

  const chipsHtml=allowed.map(x=>chip(x,"subgenres",selectedSubgenres.indexOf(x)>=0)).join("");
  if(field){
    field.querySelector(".chips").innerHTML=chipsHtml;
  }else{
    const genreField=document.querySelector('[data-chip-group="genres"]')?.closest(".field");
    if(genreField){
      genreField.insertAdjacentHTML("afterend",
        '<div class="field" id="subgenreField"><label>Subgenres</label><div class="chips">'+chipsHtml+'</div></div>');
    }
  }
}

function ensureSeriesForExistingBooks(){
  data.series=Array.isArray(data.series)?data.series:[];
  let changed=false;
  data.books.forEach(function(b){
    if(!b.seriesName)return;
    let s=data.series.find(function(x){return x.name===b.seriesName;});
    if(!s){
      s={
        id:uid(),
        name:b.seriesName,
        author:b.author||"",
        status:"unknown",
        plannedVolumes:"",
        publishedVolumes:"",
        notes:"",
        createdAt:new Date().toISOString(),
        updatedAt:new Date().toISOString()
      };
      data.series.push(s);
      changed=true;
    }
    if(!b.seriesId){
      b.seriesId=s.id;
      changed=true;
    }
  });
  if(changed)save();
}

function getSeriesById(id){
  return (data.series||[]).find(function(s){return s.id===id;})||null;
}
function getSeriesByName(name){
  return (data.series||[]).find(function(s){return s.name===name;})||null;
}
function seriesBooks(seriesId){
  return data.books.filter(function(b){
    return b.seriesId===seriesId || (!b.seriesId && getSeriesById(seriesId) && b.seriesName===getSeriesById(seriesId).name);
  });
}
function seriesStatusLabel(v){
  return {
    completed:"Abgeschlossen",
    ongoing:"Laufend",
    unknown:"Unbekannt"
  }[v]||"Unbekannt";
}
function seriesMetrics(s){
  const books=seriesBooks(s.id);
  const published = Number(s.publishedVolumes)||books.length;
  const planned = Number(s.plannedVolumes)||published||books.length;
  const read=books.filter(function(b){return b.status==="read";}).length;
  const owned=books.filter(bookOwnedByAnyEdition).length;
  const progress=published>0?Math.round((read/published)*100):0;
  return {books:books,published:published,planned:planned,read:read,owned:owned,progress:progress};
}
function seriesVolumeSortValue(v){
  if(v===null || v===undefined || v==="")return 999999;
  const n=parseFloat(String(v).replace(",","."));
  return Number.isFinite(n)?n:999998;
}

function saveSeriesFromModal(){
  const name=(document.getElementById("seriesNameModal")?.value||"").trim();
  if(!name){toast("Bitte einen Reihennamen eingeben");return;}
  const id=document.getElementById("seriesEditId")?.value||"";
  let s=id?getSeriesById(id):null;
  if(!s){
    s={id:uid(),createdAt:new Date().toISOString()};
    data.series.push(s);
  }
  s.name=name;
  s.author=(document.getElementById("seriesAuthorModal")?.value||"").trim();
  s.status=document.getElementById("seriesStatusModal")?.value||"unknown";
  s.plannedVolumes=document.getElementById("seriesPlannedModal")?.value||"";
  s.publishedVolumes=document.getElementById("seriesPublishedModal")?.value||"";
  s.notes=document.getElementById("seriesNotesModal")?.value||"";
  s.updatedAt=new Date().toISOString();
  save();
  closeSeriesModal();

  if(state.screen==="form"){
    render();
    setTimeout(function(){
      const sel=document.getElementById("seriesId");
      if(sel)sel.value=s.id;
    },0);
  }else{
    state.seriesName=s.name;
    render();
  }
  toast("Reihe gespeichert");
}


function seriesOverviewCovers(s){
  const books=seriesBooks(s.id).slice().sort(function(a,b){
    return seriesVolumeSortValue(a.volume)-seriesVolumeSortValue(b.volume);
  });
  if(!books.length){
    return '<div class="series-overview-strip"><div class="series-overview-placeholder">Keine Cover</div></div>';
  }
  return '<div class="series-overview-strip">'+books.map(function(b){
    const vol=b.volume?'<span class="series-overview-volume">'+esc(b.volume)+'</span>':'';
    if(b.cover){
      return '<button type="button" class="series-overview-book" data-open="'+esc(b.id)+'">'+
        '<img src="'+esc(b.cover)+'" alt="'+esc(b.title||"Buch")+'">'+vol+
      '</button>';

    return '<button type="button" class="series-overview-book" data-open="'+esc(b.id)+'">'+
      '<div class="series-overview-placeholder">'+esc(b.title||"Buch")+'</div>'+vol+
    '</button>';
  }).join("")+'</div>';
}

function wishlistEntries(){
  const entries=[];
  data.books.forEach(function(b){
    migrateBookEditions(b);
    const hasOwned=(b.editions||[]).some(function(e){return e.ownership==="owned"||e.purchaseStatus==="purchased";});
    (b.editions||[]).forEach(function(e){
      if(e.purchaseStatus!=="wanted")return;
      if(e.ownership==="owned")return;
      let scope=e.wishlistScope||(!hasOwned&&e.isPrimary?"book":"edition");
      entries.push({book:b,edition:e,scope:scope});
    });
  });
  return entries;
}

function avgRating(list){

function totalPages(list){return list.reduce(function(n,b){return n+(Number(b.pageCount)||0);},0);}
function countValues(list,getter){
  const map={};
  list.forEach(function(x){(getter(x)||[]).filter(Boolean).forEach(function(v){map[v]=(map[v]||0)+1;});});
  return Object.keys(map).map(function(k){return [k,map[k]];}).sort(function(a,b){return b[1]-a[1]||a[0].localeCompare(b[0]);});
}
function barChart(rows,limit){

  const max=Math.max.apply(null,rows.map(function(x){return Number(x[1])||0;}))||1;
  return '<div>'+rows.map(function(x){
    const pct=Math.max(2,Math.round((Number(x[1])||0)/max*100));
    return '<div class="chart-row"><div class="chart-label" title="'+esc(x[0])+'">'+esc(x[0])+'</div><div class="chart-track"><div class="chart-fill" style="width:'+pct+'%"></div></div><div class="chart-value">'+esc(x[1])+'</div></div>';
  }).join("")+'</div>';
}

function monthBooks(year,month){
  return data.books.filter(function(b){const d=statDate(b);return b.status==="read"&&d&&d.getFullYear()===year&&d.getMonth()===month;});

function yearBooks(year){
  return data.books.filter(function(b){const d=statDate(b);return b.status==="read"&&d&&d.getFullYear()===year;});

function saveBook(){const formEl=document.getElementById("bookForm");if(!formEl.checkValidity()){formEl.reportValidity();return;}const b=collectBook(),i=data.books.findIndex(x=>x.id===b.id);if(i<0)data.books.unshift(b);else data.books[i]=b;save();state.bookId=b.id;state.editingId=null;state.screen="detail";toast("Buch gespeichert");render();}
function deleteBook(){const b=data.books.find(x=>x.id===state.bookId);if(!b)return;if(confirm('„'+b.title+'“ wirklich löschen?')){data.books=data.books.filter(x=>x.id!==b.id);save();state.bookId=null;state.screen="library";render();}}
function togglePurchase(){const b=data.books.find(x=>x.id===state.bookId);if(!b)return;migrateBookEditions(b);const e=primaryEdition(b);if(!e)return;if(e.purchaseStatus==="wanted"){e.purchaseStatus="purchased";e.ownership="owned";toast("Als gekauft markiert");}else if(e.purchaseStatus==="purchased"){e.purchaseStatus="wanted";toast("Wieder auf Kaufliste");}else{e.purchaseStatus="wanted";toast("Zur Kaufliste hinzugefügt");}syncLegacyFromPrimaryEdition(b);save();render();}
function backupSummary(d){return {books:(d.books||[]).length,series:(d.series||[]).length,editions:(d.books||[]).reduce(function(n,b){return n+(Array.isArray(b.editions)?b.editions.length:0);},0)};}
function createBackupPayload(d,kind){return {schemaVersion:SCHEMA_VERSION,appVersion:APP_VERSION,exportedAt:new Date().toISOString(),backupType:kind||"manual",summary:backupSummary(d),data:clone(d)};}
function safeFileTimestamp(){return new Date().toISOString().replace(/[:.]/g,"-");}
function prepareBackupDownload(payload,filename){
  window.__bookvaultBackupText=JSON.stringify(payload,null,2);
  window.__bookvaultBackupFilename=filename||"bookvault-backup.json";
}
function showBackupDownloadLink(){showBackupManualFallback();}
async function downloadPreparedBackup(){
  if(!window.__bookvaultBackupText){toast("Noch kein Backup erstellt");return;}

  const filename=window.__bookvaultBackupFilename||"bookvault-backup.json";
  const text=window.__bookvaultBackupText;

  // Chromium / Edge: native "Speichern unter"
  if(window.showSaveFilePicker){
    try{
      const handle=await window.showSaveFilePicker({
        suggestedName:filename,
        types:[{description:"BookVault JSON-Backup",accept:{"application/json":[".json"]}}]
      });
      const writable=await handle.createWritable();
      await writable.write(text);
      await writable.close();
      toast("Backup gespeichert");
      return;
    }catch(err){
      if(err && err.name==="AbortError"){toast("Speichern abgebrochen");return;}
    }
  }

  // Firefox fallback: direct data URL created inside the real user click.
  try{
    const dataUrl="data:application/json;charset=utf-8,"+encodeURIComponent(text);
    const a=document.createElement("a");
    a.href=dataUrl;
    a.download=filename;
    a.target="_self";
    a.style.display="none";
    document.body.appendChild(a);
    a.click();
    a.remove();
    toast("Download angefordert");
  }catch(err){
    showBackupManualFallback();
  }
}
function showBackupManualFallback(){
  const host=document.getElementById("backupFallback");
  if(!host||!window.__bookvaultBackupText)return;
  host.innerHTML=
    '<button type="button" class="btn primary" style="display:block;width:100%;margin:8px 0" data-action="showBackupJson">Backup-JSON anzeigen</button>'+
    '<button type="button" class="btn" style="display:block;width:100%;margin:8px 0" data-action="copyBackupText">Backup-JSON direkt kopieren</button>'+
    '<button type="button" class="btn" style="display:block;width:100%;margin:8px 0" data-action="downloadPreparedBackup">Dateidownload versuchen</button>'+
    '<p class="muted" style="margin:4px 0 8px">„Backup-JSON anzeigen“ funktioniert ohne Download und ohne neuen Tab.</p>';
}
function openBackupText(){
  if(!window.__bookvaultBackupText)return;
  const dataUrl="data:application/json;charset=utf-8,"+encodeURIComponent(window.__bookvaultBackupText);
  const w=window.open(dataUrl,"_blank");
  if(!w)toast("Neuer Tab wurde vom Browser blockiert");
}
function copyBackupText(){
  if(!window.__bookvaultBackupText)return;
  const text=window.__bookvaultBackupText;
  const fallback=function(){
    const ta=document.createElement("textarea");
    ta.value=text;ta.style.position="fixed";ta.style.left="-9999px";
    document.body.appendChild(ta);ta.focus();ta.select();
    try{document.execCommand("copy");toast("Backup-JSON kopiert");}
    catch(_){toast("Kopieren nicht möglich");}
    ta.remove();
  };
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){toast("Backup-JSON kopiert");}).catch(fallback);
  }else fallback();
}
function showBackupJsonModal(){
  if(!window.__bookvaultBackupText){toast("Noch kein Backup erstellt");return;}
  let old=document.getElementById("backupJsonModal");
  if(old)old.remove();
  const wrap=document.createElement("div");
  wrap.id="backupJsonModal";
  wrap.className="backup-overlay";
  wrap.innerHTML=
    '<div class="backup-dialog">'+
      '<div class="backup-dialog-head"><div><h2 style="margin:0;color:#285f4d">Backup-JSON</h2><div class="muted">'+esc(window.__bookvaultBackupFilename||"bookvault-backup.json")+'</div></div>'+
      '<button type="button" class="icon-btn" data-action="closeBackupJson">✕</button></div>'+
      '<p class="muted">Das vollständige Backup wird direkt in BookVault angezeigt. Du kannst es kopieren und als .json-Datei speichern.</p>'+
      '<textarea id="backupJsonText" readonly></textarea>'+
      '<div class="backup-dialog-actions">'+
        '<button type="button" class="btn primary" data-action="selectBackupJson">Gesamtes JSON markieren</button>'+
        '<button type="button" class="btn" data-action="copyBackupText">Backup-JSON kopieren</button>'+
        '<button type="button" class="btn" data-action="closeBackupJson">Schließen</button>'+
      '</div>'+
    '</div>';
  document.body.appendChild(wrap);
  const ta=document.getElementById("backupJsonText");
  if(ta)ta.value=window.__bookvaultBackupText;
}
function selectBackupJson(){
  const ta=document.getElementById("backupJsonText");
  if(!ta)return;
  ta.focus();ta.select();ta.setSelectionRange(0,ta.value.length);
  toast("Gesamtes Backup markiert");
}
function closeBackupJson(){
  const m=document.getElementById("backupJsonModal");
  if(m)m.remove();
}

function exportData(){
  const prepared=prepareData(data);
  data=prepared.data;
  save();
  prepareBackupDownload(
    createBackupPayload(data,"manual"),
    "bookvault-backup_"+safeFileTimestamp()+".json"
  );
  render();
  showBackupDownloadLink();
  toast("Backup erstellt – Downloadoption auswählen");
}
function importData(file){if(!file)return;const reader=new FileReader();reader.onload=function(){try{const parsed=JSON.parse(reader.result),candidate=(parsed&&parsed.data&&typeof parsed.data==="object")?parsed.data:parsed;if(!candidate||typeof candidate!=="object"||!Array.isArray(candidate.books))throw new Error("invalid");const prepared=prepareData(candidate);prepareBackupDownload(createBackupPayload(data,"pre-import-safety"),"bookvault-vor-import_"+safeFileTimestamp()+".json");data=prepared.data;save();state.screen="settings";state.bookId=null;state.editingId=null;render();showBackupDownloadLink();const r=prepared.report.repairs;toast(r>0?"Backup importiert – "+r+" Datenfehler automatisch korrigiert. Sicherheitsbackup steht zum Download bereit.":"Backup importiert – Daten geprüft. Sicherheitsbackup steht zum Download bereit.");}catch(e){alert("Ungültiges oder nicht lesbares BookVault-Backup. Die vorhandenen Daten wurden nicht verändert.");}};reader.readAsText(file);}
function sortMenu(){const x=prompt("Sortierung eingeben: added, title, author oder rating",data.settings.sort);if(["added","title","author","rating"].indexOf(x)>=0){data.settings.sort=x;save();render();}}
function toggleFavoriteButton(){const button=document.getElementById("favorite");if(!button)return;const active=button.classList.toggle("primary");button.textContent=active?"❤️ Favorit":"♡ Als Favorit markieren";button.setAttribute("aria-pressed",active?"true":"false");toast(active?"Als Favorit markiert":"Favorit entfernt");}
document.addEventListener("click",function(e){

const navEl=e.target.closest("[data-nav]");if(navEl){const n=navEl.getAttribute("data-nav");if(n==="add"){state.editingId=null;state.screen="form";}else if(n==="favorites")state.screen="favorites";else state.screen=n;render();return;}

const removeTrope=e.target.closest("[data-remove-selected-trope]");if(removeTrope){removeSelectedTropeByName(removeTrope.getAttribute("data-remove-selected-trope"));return;}



const sy=e.target.closest("[data-stats-year]");if(sy){state.statsYear=(Number(state.statsYear)||new Date().getFullYear())+Number(sy.getAttribute("data-stats-year"));render();return;}
const sm=e.target.closest("[data-stats-month]");if(sm){let y=Number(state.statsYear)||new Date().getFullYear(),m=Number(state.statsMonth);m+=Number(sm.getAttribute("data-stats-month"));if(m<0){m=11;y--;}if(m>11){m=0;y++;}state.statsMonth=m;state.statsYear=y;render();return;}
const wtab=e.target.closest("[data-wishlist-tab]");if(wtab){state.wishlistTab=wtab.getAttribute("data-wishlist-tab");render();return;}

const wedit=e.target.closest("[data-wishlist-edit]");if(wedit){const x=wishlistPair(wedit.getAttribute("data-wishlist-edit"));if(x.book&&x.edition)openEditionModal(x.book.id,x.edition.id);return;}
const cardFav=e.target.closest("[data-card-favorite]");if(cardFav){e.stopPropagation();toggleBookFavoriteById(cardFav.getAttribute("data-card-favorite"));return;}

const cardEdit=e.target.closest("[data-card-edit]");if(cardEdit){state.editingId=cardEdit.getAttribute("data-card-edit");state.bookId=state.editingId;state.screen="form";render();return;}
const cardStatus=e.target.closest("[data-card-cycle-status]");if(cardStatus){cycleBookStatusById(cardStatus.getAttribute("data-card-cycle-status"));return;}
const cardPurchase=e.target.closest("[data-card-purchase]");if(cardPurchase){cycleBookPurchaseById(cardPurchase.getAttribute("data-card-purchase"));return;}
const cardSeries=e.target.closest("[data-card-series]");if(cardSeries){state.seriesName=cardSeries.getAttribute("data-card-series");state.screen="seriesDetail";render();return;}
const cardEditions=e.target.closest("[data-card-editions]");if(cardEditions){state.bookId=cardEditions.getAttribute("data-card-editions");state.screen="detail";render();setTimeout(function(){document.getElementById("editionsSection")?.scrollIntoView({behavior:"smooth",block:"start"});},0);return;}
const cardDelete=e.target.closest("[data-card-delete]");if(cardDelete){const id=cardDelete.getAttribute("data-card-delete");const b=data.books.find(function(x){return x.id===id;});if(b&&confirm('„'+b.title+'“ wirklich löschen?')){data.books=data.books.filter(function(x){return x.id!==id;});save();render();}return;}
const editEdition=e.target.closest("[data-edit-edition]");if(editEdition){openEditionModal(state.bookId,editEdition.getAttribute("data-edit-edition"));return;}
const primaryEd=e.target.closest("[data-primary-edition]");if(primaryEd){setPrimaryEdition(state.bookId,primaryEd.getAttribute("data-primary-edition"));return;}

const adv=e.target.closest("[data-adv-group]");if(adv){toggleAdvancedFilter(adv.getAttribute("data-adv-group"),adv.getAttribute("data-adv-value"));return;}const rmin=e.target.closest("[data-rating-min]");if(rmin){state.advancedFilters.ratingMin=rmin.getAttribute("data-rating-min");render();return;}const rclear=e.target.closest("[data-rating-clear]");if(rclear){state.advancedFilters.ratingMin="";render();return;}const action=e.target.closest("[data-action]");if(action){const a=action.getAttribute("data-action");if(a==="lookupIsbn"){lookupIsbn();}else if(a==="downloadPreparedBackup"){downloadPreparedBackup();}else if(a==="showBackupJson"){showBackupJsonModal();}else if(a==="selectBackupJson"){selectBackupJson();}else if(a==="closeBackupJson"){closeBackupJson();}else if(a==="openBackupText"){openBackupText();}else if(a==="copyBackupText"){copyBackupText();}else if(a==="toggleAdvancedFilters"){state.showAdvancedFilters=!state.showAdvancedFilters;render();}else if(a==="toggleSortDir"){state.sortDir=state.sortDir==="asc"?"desc":"asc";render();}else if(a==="clearLibraryFilters")clearAdvancedFilters();else if(a==="clearSearch"){state.query="";render();setTimeout(function(){document.getElementById("searchInput")?.focus();},0);}else if(a==="addCustomTrope")addCustomTrope();else if(a==="saveCustomTrope")saveCustomTropeFromModal();else if(a==="cancelCustomTrope")closeCustomTropeModal();else if(a==="newSeries")openSeriesModal();else if(a==="editSeries"){const s=getSeriesByName(state.seriesName);if(s)openSeriesModal(s.id);}else if(a==="saveSeriesModal")saveSeriesFromModal();else if(a==="cancelSeriesModal")closeSeriesModal();else if(a==="addEdition")openEditionModal(state.bookId);else if(a==="addWishlistEdition")openWishlistEditionModal(state.bookId);else if(a==="saveEditionModal")saveEditionFromModal();else if(a==="cancelEditionModal")closeEditionModal();else if(a==="deleteEdition"){
  const bookId=action.getAttribute("data-book-id")||state.bookId;
  const editionId=action.getAttribute("data-edition-id");
  deleteEdition(bookId,editionId);
}else if(a==="openCurrentSeries"){if(state.bookId){const b=data.books.find(function(x){return x.id===state.bookId;});if(b&&b.seriesName){state.seriesName=b.seriesName;state.screen="seriesDetail";render();}}}else if(a==="jumpEditions"){document.getElementById("editionsSection")?.scrollIntoView({behavior:"smooth",block:"start"});}else if(a==="home")go("home");else if(a==="favorite")toggleFavoriteButton();else if(a==="edit"){state.editingId=state.bookId;state.screen="form";render();}else if(a==="delete")deleteBook();else if(a==="buy")togglePurchase();else if(a==="toggleView"){data.settings.view=data.settings.view==="grid"?"list":"grid";save();render();}else if(a==="sort")sortMenu();else if(a==="cancelForm"){state.editingId=null;state.screen=state.bookId?"detail":"library";render();}else if(a==="export")exportData();else if(a==="reset"){if(confirm("Alle Bücher und Einstellungen löschen?")){localStorage.removeItem(STORAGE_KEY);data=clone(DEFAULT);state={screen:"home",filter:"all",query:"",bookId:null,editingId:null,seriesName:null,sort:"new",sortDir:"desc",showAdvancedFilters:false,advancedFilters:{genres:[],subgenres:[],tropes:[],statuses:[],ownership:[],formats:[],languages:[],authors:[],seriesType:[],ratingMin:""},filterSearch:{genres:"",tropes:""},wishlistTab:"all",statsYear:new Date().getFullYear(),statsMonth:new Date().getMonth()};render();}}}
});

document.addEventListener("change",function(e){if(e.target.id==="coverFile"){const file=e.target.files&&e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=function(){const cover=document.getElementById("cover"),preview=document.getElementById("preview");if(cover)cover.value=reader.result;if(preview)preview.innerHTML='<img src="'+reader.result+'" style="width:75px;height:110px;object-fit:cover;border-radius:9px">';};reader.readAsDataURL(file);}if(e.target.id==="importFile")importData(e.target.files&&e.target.files[0]);});
document.addEventListener("submit",function(e){if(e.target.id==="bookForm"){e.preventDefault();saveBook();}});

window.addEventListener("error",function(e){console.error("BookVault error:",e.error||e.message);});

});
