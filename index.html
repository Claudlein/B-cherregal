<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111015">
<title>BookVault V1.0.3</title>
<style>
:root{--bg:#111015;--panel:#1b1921;--panel2:#24212b;--text:#f5f2f7;--muted:#aaa4b2;--accent:#c8a9ea;--line:#332f3a;--danger:#e67d8c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;padding-bottom:92px}.app{max-width:760px;margin:auto;padding:env(safe-area-inset-top) 16px 20px}.top{display:flex;justify-content:space-between;align-items:center;padding:18px 0 14px}.eyebrow{font-size:12px;color:var(--muted)}.title{font-size:28px;font-weight:800;margin-top:2px}.icon,.btn,.pill,.chip,.nav button{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:14px}.icon{width:42px;height:42px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:15px}.stat span{font-size:12px;color:var(--muted)}.stat b{display:block;font-size:27px;margin-top:5px}.section{margin:22px 0}.section h2{font-size:18px}.sectionhead{display:flex;justify-content:space-between;align-items:center}.link{color:var(--accent);background:none;border:0}.bookrow{display:flex;gap:12px;overflow:auto}.cover{width:94px;height:136px;border-radius:10px;object-fit:cover;background:#302c36}.cover.sm{width:64px;height:92px}.cover.lg{width:160px;height:232px}.placeholder{display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;font-weight:700;color:#dcd2e7}.mini{min-width:94px;text-align:left}.mini b{display:block;font-size:12px;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mini small{color:var(--muted)}.hero{display:flex;gap:14px;align-items:center;background:linear-gradient(135deg,#282230,#17151c);border:1px solid var(--line);border-radius:20px;padding:15px}.hero h3{margin:0 0 4px}.muted{color:var(--muted)}.progress{height:7px;background:#302d37;border-radius:99px;overflow:hidden;margin:10px 0}.progress i{display:block;height:100%;background:var(--accent)}.pillrow,.chips{display:flex;gap:7px;flex-wrap:wrap}.pill,.chip{padding:8px 11px;font-size:12px}.pill.active,.chip.selected,.btn.primary{background:#c8a9ea;color:#17131b;border-color:#c8a9ea;font-weight:750}.search{display:flex;gap:8px}.input,.select,.textarea{width:100%;padding:13px;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--text);outline:0}.textarea{min-height:110px;resize:vertical}.filters{display:flex;gap:7px;overflow:auto;margin:10px 0}.toolbar{display:flex;gap:8px;margin:10px 0}.toolbar>*{flex:1}.btn{padding:12px 14px;text-align:center}.list{display:flex;flex-direction:column;gap:9px}.item{width:100%;display:flex;gap:12px;text-align:left;padding:12px;background:var(--panel);border:1px solid var(--line);border-radius:17px}.item .details{min-width:0;flex:1}.item h3{margin:0 0 4px;font-size:16px}.item p{margin:3px 0;font-size:12px;color:var(--muted)}.stars{font-size:29px;letter-spacing:1px}.stars button{font-size:29px;border:0;background:none;color:#5c5662;padding:0}.stars button.on{color:#f2c76c}.form{display:flex;flex-direction:column;gap:14px}.field label{display:block;font-size:12px;color:#ddd7e3;margin-bottom:7px}.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;background:var(--panel);padding:5px;border-radius:14px}.seg button{padding:9px 3px;border:0;border-radius:10px;background:transparent;color:var(--muted);font-size:11px}.seg button.sel{background:#362d40;color:var(--text)}.detail{text-align:center}.detail h1{margin:13px 0 3px}.danger{background:#3b2027;color:#ffc8cf;border-color:#61303a;width:100%}.bottom{position:fixed;z-index:10;left:0;right:0;bottom:0;background:#16141cdd;backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom))}.nav{max-width:760px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.nav button{border:0;background:transparent;padding:6px 2px;font-size:10px;color:var(--muted)}.nav button.active{background:#2b2731;color:var(--text)}.nav strong{display:block;font-size:19px}.empty{text-align:center;padding:35px 15px;color:var(--muted);border:1px dashed var(--line);border-radius:18px}.toast{position:fixed;z-index:50;left:50%;bottom:105px;transform:translateX(-50%);background:#f5f2f7;color:#17131b;padding:11px 15px;border-radius:13px;font-weight:700;font-size:13px}.hidden{display:none!important}@media(min-width:620px){.grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<div id="app"></div>
<div class="bottom"><div class="nav" id="nav"></div></div>
<div id="toast" class="toast hidden"></div>
<script>
"use strict";
const KEY="bookvault_clean_v103";
const DEFAULT={
 books:[],
 genres:["Dark Romance","Romance","Romantasy","Fantasy","Thriller","Krimi","Mystery","Science Fiction","Horror","Historisch","New Adult","Young Adult","Contemporary","Sonstiges"],
 tropes:["Enemies to Lovers","Friends to Lovers","Forced Proximity","Morally Grey","Slow Burn","Found Family","Fake Dating","Second Chance","Forbidden Love","Mafia","Possessive MMC","Grumpy × Sunshine"],
 settings:{view:"grid",sort:"added"}
};
let data;
try{data=JSON.parse(localStorage.getItem(KEY)||"null");if(!data||!Array.isArray(data.books))throw 0}catch(e){data=JSON.parse(JSON.stringify(DEFAULT))}
data.genres=Array.isArray(data.genres)?data.genres:JSON.parse(JSON.stringify(DEFAULT.genres));
data.tropes=Array.isArray(data.tropes)?data.tropes:JSON.parse(JSON.stringify(DEFAULT.tropes));
data.settings=data.settings||{view:"grid",sort:"added"};
let state={screen:"home",filter:"all",query:"",editing:null,book:null,series:null};

function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){alert("Speichern nicht möglich. Bitte Speicherplatz prüfen.")}}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2)}
function cover(b,cl=""){return b.cover?`<img class="cover ${cl}" src="${esc(b.cover)}" alt="">`:`<div class="cover placeholder ${cl}">${esc(b.title||"Buch")}</div>`}
function stars(n){return "★★★★★".split("").map((x,i)=>i<n?"★":"☆").join("")}
function own(o){return ({owned:"🏠 In meinem Besitz",borrowed:"🤝 Ausgeliehen",kindleUnlimited:"📱 Kindle Unlimited"})[o]||"🏠 In meinem Besitz"}
function status(s){return ({unread:"Ungelesen",reading:"Reading",read:"Gelesen",dnf:"DNF"})[s]||"Ungelesen"}
function purchase(p){return p==="wanted"?"🛒 Möchte ich kaufen":p==="purchased"?"✓ Gekauft":""}
function owned(){return data.books.filter(b=>b.ownership==="owned").length}
function go(s){state.screen=s;render()}
function nav(){return `<button class="${state.screen==="home"?"active":""}" onclick="go('home')"><strong>⌂</strong>Home</button><button class="${state.screen==="library"?"active":""}" onclick="go('library')"><strong>▦</strong>Bibliothek</button><button onclick="form()"><strong>＋</strong>Hinzufügen</button><button class="${state.screen==="series"?"active":""}" onclick="go('series')"><strong>▤</strong>Reihen</button><button class="${state.screen==="more"?"active":""}" onclick="go('more')"><strong>⋯</strong>Mehr</button>`}
function top(t,s=""){return `<div class="top"><div><div class="eyebrow">${esc(s)}</div><div class="title">${esc(t)}</div></div>${t==="Home"?"":`<button class="icon" onclick="go('home')">⌂</button>`}</div>`}
function render(){document.getElementById("nav").innerHTML=nav();const a=document.getElementById("app");a.innerHTML=state.screen==="home"?home():state.screen==="library"?library():state.screen==="detail"?detail():state.screen==="form"?form():state.screen==="series"?series():state.screen==="seriesDetail"?seriesDetail():state.screen==="more"?more():state.screen==="stats"?stats():state.screen==="favorites"?favorites():state.screen==="settings"?settings():""}
function home(){
 const recent=[...data.books].sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt)).slice(0,8), fav=data.books.filter(b=>b.favorite).slice(0,8), reading=data.books.find(b=>b.status==="reading");
 return `<main class="app">${top("Home","BookVault V1.0.3")}<div class="grid"><div class="card stat"><span>In meinem Besitz</span><b>${owned()}</b></div><div class="card stat"><span>Katalogisiert</span><b>${data.books.length}</b></div><div class="card stat"><span>Gelesen</span><b>${data.books.filter(b=>b.status==="read").length}</b></div><div class="card stat"><span>Ungelesen</span><b>${data.books.filter(b=>b.status==="unread").length}</b></div></div>
 ${reading?`<section class="section"><div class="sectionhead"><h2>Aktuell gelesen</h2><button class="link" onclick="openBook('${reading.id}')">Öffnen →</button></div><div class="hero">${cover(reading,"sm")}<div><h3>${esc(reading.title)}</h3><div class="muted">${esc(reading.author)}</div><div class="progress"><i style="width:${reading.progress||0}%"></i></div><small class="muted">${reading.progress||0}%</small></div></div></section>`:""}
 <section class="section"><div class="sectionhead"><h2>Zuletzt hinzugefügt</h2><button class="link" onclick="go('library')">Alle →</button></div>${recent.length?`<div class="bookrow">${recent.map(mini).join("")}</div>`:`<div class="empty">Noch keine Bücher. Tippe unten auf Hinzufügen.</div>`}</section>
 <section class="section"><div class="sectionhead"><h2>Favoriten</h2><button class="link" onclick="go('favorites')">Alle →</button></div>${fav.length?`<div class="bookrow">${fav.map(mini).join("")}</div>`:`<div class="empty">Noch keine Favoriten.</div>`}</section>
 <div class="card"><b>📚 ${data.books.length-owned()} Bücher nicht im Besitz</b><p class="muted">Ausgeliehene und Kindle-Unlimited-Bücher zählen nicht zu deinem Besitz.</p></div></main>`
}
function mini(b){return `<button class="mini" onclick="openBook('${b.id}')">${cover(b)}<b>${esc(b.title)}</b><small>${esc(b.author)}</small></button>`}
function getBooks(){
 let a=[...data.books],q=state.query.toLowerCase();
 if(state.filter==="owned")a=a.filter(b=>b.ownership==="owned");if(state.filter==="borrowed")a=a.filter(b=>b.ownership==="borrowed");if(state.filter==="ku")a=a.filter(b=>b.ownership==="kindleUnlimited");if(state.filter==="wanted")a=a.filter(b=>b.purchaseStatus==="wanted");if(state.filter==="favorites")a=a.filter(b=>b.favorite);if(["read","unread","reading","dnf"].includes(state.filter))a=a.filter(b=>b.status===state.filter);
 if(q)a=a.filter(b=>[b.title,b.author,b.seriesName,b.review,b.notes,...(b.genres||[]),...(b.tropes||[])].join(" ").toLowerCase().includes(q));
 const s=data.settings.sort;a.sort((x,y)=>s==="title"?x.title.localeCompare(y.title):s==="author"?x.author.localeCompare(y.author):s==="rating"?(y.rating||0)-(x.rating||0):new Date(y.createdAt)-new Date(x.createdAt));return a;
}
function library(){
 const bs=getBooks();
 return `<main class="app">${top("Bibliothek",`${data.books.length} katalogisiert · ${owned()} im Besitz`)}<div class="search"><input class="input" value="${esc(state.query)}" placeholder="Titel, Autor, Reihe, Trope…" oninput="state.query=this.value;render()"></div><div class="filters">${["all","owned","borrowed","ku","wanted","favorites","read","unread","reading","dnf"].map(f=>`<button class="pill ${state.filter===f?"active":""}" onclick="state.filter='${f}';render()">${({all:"Alle",owned:"Besitz",borrowed:"Ausgeliehen",ku:"KU",wanted:"🛒 Kaufliste",favorites:"❤️ Favoriten",read:"Gelesen",unread:"Ungelesen",reading:"Reading",dnf:"DNF"})[f]}</button>`).join("")}</div><div class="toolbar"><button class="btn" onclick="data.settings.view=data.settings.view==='grid'?'list':'grid';save();render()">${data.settings.view==="grid"?"☷ Liste":"▦ Cover"}</button><button class="btn" onclick="sortMenu()">↕ Sortieren</button></div>${bs.length?(data.settings.view==="grid"?`<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px">${bs.map(b=>`<button style="text-align:left" onclick="openBook('${b.id}')">${cover(b)}<b style="display:block;font-size:12px;margin-top:5px">${esc(b.title)}</b><small class="muted">${esc(b.author)}</small></button>`).join("")}</div>`:`<div class="list">${bs.map(item).join("")}</div>`):`<div class="empty">Keine Bücher gefunden.</div>`}</main>`
}
function item(b){return `<button class="item" onclick="openBook('${b.id}')">${cover(b,"sm")}<div class="details"><h3>${esc(b.title)}</h3><p>${esc(b.author)}</p><p>${stars(b.rating||0)} · ${status(b.status)}</p><p>${own(b.ownership)} ${purchase(b.purchaseStatus)}</p></div></button>`}
function openBook(id){state.book=id;state.screen="detail";render()}
function detail(){
 const b=data.books.find(x=>x.id===state.book);if(!b){go("library");return""}
 return `<main class="app">${top("Buch","Bibliothek")}<div class="detail">${cover(b,"lg")}<h1>${esc(b.title)}</h1><div class="muted">${esc(b.author)}</div><div class="stars">${stars(b.rating||0)}</div><div class="pillrow" style="justify-content:center;margin:10px 0">${[own(b.ownership),status(b.status),purchase(b.purchaseStatus)].filter(Boolean).map(x=>`<span class="pill active">${esc(x)}</span>`).join("")}</div>${b.seriesName?`<p class="muted">${esc(b.seriesName)}${b.volume?" · Band "+esc(b.volume):""}</p>`:""}<div class="toolbar"><button class="btn primary" onclick="form('${b.id}')">Bearbeiten</button><button class="btn" onclick="buy('${b.id}')">${b.purchaseStatus==="wanted"?"✓ Als gekauft":"🛒 Kaufen"}</button></div></div>
 <section class="section"><h2>Informationen</h2><div class="card">${b.pageCount||"—"} Seiten · ${esc(b.language||"Deutsch")} · ${esc(b.format||"E-Book")}<p class="muted">${esc(b.publisher||"")}${b.publicationYear?" · "+esc(b.publicationYear):""}</p></div></section>
 <section class="section"><h2>Genres & Tropes</h2><div class="pillrow">${[...(b.genres||[]),...(b.tropes||[])].map(x=>`<span class="pill">${esc(x)}</span>`).join("")||"<span class='muted'>Keine</span>"}</div></section>
 <section class="section"><h2>Meine Rezension</h2><div class="card">${b.review?esc(b.review).replace(/\\n/g,"<br>"):"<span class='muted'>Keine Rezension.</span>"}</div></section>
 <section class="section"><h2>Notizen</h2><div class="card">${b.notes?esc(b.notes).replace(/\\n/g,"<br>"):"<span class='muted'>Keine Notizen.</span>"}</div></section>
 <button class="btn danger" onclick="del('${b.id}')">Buch löschen</button></main>`
}
function form(id=null){
 const b=id?data.books.find(x=>x.id===id):{ownership:"owned",status:"unread",rating:0,favorite:false,purchaseStatus:"none",language:"Deutsch",format:"E-Book",genres:[],tropes:[]};
 state.editing=id;
 return `<main class="app">${top(id?"Bearbeiten":"Buch hinzufügen","Bibliothek")}<form class="form" onsubmit="event.preventDefault();saveBook()">
 <div class="field"><label>Cover</label><label class="btn" style="display:block;text-align:center">📷 Cover aus Fotos auswählen<input id="coverFile" type="file" accept="image/*" hidden onchange="readCover(event)"></label><input id="cover" class="input" type="text" value="${esc(b.cover||"")}" placeholder="oder Bild-URL einfügen" style="margin-top:8px"><div id="preview" style="margin-top:8px">${b.cover?`<img src="${esc(b.cover)}" style="width:75px;height:110px;object-fit:cover;border-radius:9px">`:""}</div></div>
 ${field("title","Titel",b.title,true)}${field("author","Autor",b.author,true)}${field("subtitle","Untertitel",b.subtitle)}${field("isbn","ISBN",b.isbn)}
 <div class="two">${field("publisher","Verlag",b.publisher)}${field("year","Erscheinungsjahr",b.publicationYear,"", "number")}</div><div class="two">${field("pages","Seitenzahl",b.pageCount,"","number")}<div class="field"><label>Sprache</label><select id="language" class="select">${["Deutsch","Englisch","Französisch","Spanisch","Andere"].map(x=>`<option ${b.language===x?"selected":""}>${x}</option>`).join("")}</select></div></div>
 <div class="field"><label>Format</label><select id="format" class="select">${["E-Book","Taschenbuch","Hardcover","Hörbuch","Sonstiges"].map(x=>`<option ${b.format===x?"selected":""}>${x}</option>`).join("")}</select></div>
 ${seg("Besitzstatus","ownership",b.ownership,[["owned","🏠 Besitz"],["borrowed","🤝 Ausgeliehen"],["kindleUnlimited","📱 KU"]])}
 <div class="two"><div class="field"><label>Ausgeliehen von</label><input id="borrowedFrom" class="input" value="${esc(b.borrowedFrom||"")}"></div><div class="field"><label>Rückgabe</label><input id="returnDue" class="input" type="date" value="${esc(b.returnDue||"")}"></div></div>
 ${field("seriesName","Reihe",b.seriesName)}${field("volume","Band",b.volume,"","number")}
 <div class="field"><label>Genres</label><div class="chips">${data.genres.map(x=>chip(x,"genres",(b.genres||[]).includes(x))).join("")}</div></div>
 <div class="field"><label>Tropes</label><div class="chips">${data.tropes.map(x=>chip(x,"tropes",(b.tropes||[]).includes(x))).join("")}</div><input id="customTrope" class="input" placeholder="Eigenen Trope hinzufügen" style="margin-top:8px"></div>
 ${seg("Lesestatus","status",b.status,[["unread","Ungelesen"],["reading","Reading"],["read","Gelesen"],["dnf","DNF"]])}
 <div class="field"><label>Bewertung</label><div class="stars" id="ratingStars">${[1,2,3,4,5].map(i=>`<button type="button" class="${(b.rating||0)>=i?"on":""}" onclick="rating(${i})">${(b.rating||0)>=i?"★":"☆"}</button>`).join("")}</div><input id="rating" type="hidden" value="${b.rating||0}"></div>
 <button type="button" id="favorite" class="btn ${b.favorite?"primary":""}" onclick="this.classList.toggle('primary')">${b.favorite?"❤️ Favorit":"♡ Als Favorit markieren"}</button>
 ${seg("Kaufstatus","purchaseStatus",b.purchaseStatus,[["none","Kein Wunsch"],["wanted","🛒 Kaufen"],["purchased","✓ Gekauft"]])}
 <div class="two">${field("started","Begonnen",b.startedAt,"","date")}${field("finished","Beendet",b.finishedAt,"","date")}</div>${field("currentPage","Aktuelle Seite",b.currentPage,"","number")}${field("progress","Fortschritt %",b.progress,"","number")}
 <div class="field"><label>Meine Rezension</label><textarea id="review" class="textarea">${esc(b.review||"")}</textarea></div><div class="field"><label>Meine Notizen</label><textarea id="notes" class="textarea">${esc(b.notes||"")}</textarea></div>
 <div class="toolbar"><button type="button" class="btn" onclick="go(${id?"'detail'":"'library'"})">Abbrechen</button><button class="btn primary">Speichern</button></div></form></main>`
}
function field(id,label,value="",req=false,type="text"){return `<div class="field"><label>${esc(label)}${req?" *":""}</label><input id="${id}" class="input" type="${type||"text"}" ${req?"required":""} value="${esc(value)}"></div>`}
function chip(x,g,on){return `<button type="button" class="chip ${on?"selected":""}" data-group="${g}" data-val="${esc(x)}" onclick="this.classList.toggle('selected')">${esc(x)}</button>`}
function seg(label,id,val,opts){return `<div class="field"><label>${label}</label><div class="seg">${opts.map(o=>`<button type="button" class="${val===o[0]?"sel":""}" onclick="pick('${id}','${o[0]}',this)">${o[1]}</button>`).join("")}</div><input id="${id}" type="hidden" value="${esc(val||"")}"></div>`}
function pick(id,val,el){document.getElementById(id).value=val;el.parentElement.querySelectorAll("button").forEach(x=>x.classList.remove("sel"));el.classList.add("sel")}
function rating(n){document.getElementById("rating").value=n;document.querySelectorAll("#ratingStars button").forEach((b,i)=>{b.classList.toggle("on",i<n);b.textContent=i<n?"★":"☆"})}
function readCover(e){const f=e.target.files&&e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{document.getElementById("cover").value=r.result;document.getElementById("preview").innerHTML=`<img src="${r.result}" style="width:75px;height:110px;object-fit:cover;border-radius:9px">`};r.readAsDataURL(f)}
function vals(g){return [...document.querySelectorAll(`.chip[data-group="${g}"].selected`)].map(x=>x.dataset.val)}
function saveBook(){
 const old=state.editing?data.books.find(x=>x.id===state.editing):null;
 const b={...(old||{}),id:old?.id||uid(),createdAt:old?.createdAt||new Date().toISOString(),updatedAt:new Date().toISOString()};
 for(const id of ["title","author","subtitle","isbn","publisher","year","pages","language","format","ownership","borrowedFrom","returnDue","seriesName","volume","status","rating","purchaseStatus","started","finished","currentPage","progress","review","notes","cover"])b[id]=document.getElementById(id)?.value||"";
 b.pageCount=+b.pages||0;b.publicationYear=b.year;b.genres=vals("genres");b.tropes=vals("tropes");b.rating=+b.rating||0;b.currentPage=+b.currentPage||0;b.progress=Math.max(0,Math.min(100,+b.progress||0));b.favorite=document.getElementById("favorite").classList.contains("primary");
 const custom=document.getElementById("customTrope").value.trim();if(custom)b.tropes.push(custom);
 if(b.purchaseStatus==="purchased")b.ownership="owned";
 delete b.pages;delete b.year;
 const i=data.books.findIndex(x=>x.id===b.id);if(i<0)data.books.unshift(b);else data.books[i]=b;
 save();state.book=b.id;state.screen="detail";toast("Buch gespeichert");render()
}
function del(id){if(confirm("Buch wirklich löschen?")){data.books=data.books.filter(b=>b.id!==id);save();go("library")}}
function buy(id){const b=data.books.find(x=>x.id===id);if(!b)return;if(b.purchaseStatus==="wanted"){b.purchaseStatus="purchased";b.ownership="owned";toast("Als gekauft markiert")}else{b.purchaseStatus="wanted";toast("Zur Kaufliste hinzugefügt")}save();render()}
function series(){const m={};data.books.forEach(b=>{if(b.seriesName){m[b.seriesName]??=[];m[b.seriesName].push(b)}});return `<main class="app">${top("Reihen","Deine Reihen")}${Object.keys(m).length?`<div class="list">${Object.entries(m).map(([n,bs])=>`<button class="item" onclick="state.series=${JSON.stringify(n)};state.screen='seriesDetail';render()"><div class="cover sm placeholder">📚</div><div class="details"><h3>${esc(n)}</h3><p>${bs.length} Bände · ${bs.filter(b=>b.status==="read").length} gelesen</p></div></button>`).join("")}</div>`:`<div class="empty">Noch keine Reihen.</div>`}</main>`}
function seriesDetail(){const bs=data.books.filter(b=>b.seriesName===state.series).sort((a,b)=>(a.volume||999)-(b.volume||999));return `<main class="app">${top(state.series,"Reihe")}<div class="list">${bs.map(item).join("")}</div></main>`}
function more(){return `<main class="app">${top("Mehr","Verwaltung")}<div class="list">${[["stats","📊","Statistiken"],["favorites","❤️","Favoriten"],["settings","⚙️","Einstellungen"]].map(x=>`<button class="card" style="text-align:left" onclick="go('${x[0]}')">${x[1]} &nbsp; <b>${x[2]}</b>　›</button>`).join("")}</div><div class="card" style="margin-top:12px"><b>🛒 Kaufliste</b><p class="muted">${data.books.filter(b=>b.purchaseStatus==="wanted").length} Bücher</p><button class="btn" style="width:100%" onclick="state.filter='wanted';go('library')">Öffnen</button></div></main>`}
function favorites(){const bs=data.books.filter(b=>b.favorite);return `<main class="app">${top("Favoriten","Lieblingsbücher")}<div class="list">${bs.length?bs.map(item).join(""):`<div class="empty">Noch keine Favoriten.</div>`}</div></main>`}
function stats(){const r=data.books.filter(b=>b.status==="read"),pages=r.reduce((n,b)=>n+(+b.pageCount||0),0),avg=r.length?(r.reduce((n,b)=>n+(+b.rating||0),0)/r.length).toFixed(1):"0.0";return `<main class="app">${top("Statistiken","Lesehistorie")}<div class="grid"><div class="card stat"><span>Gelesen</span><b>${r.length}</b></div><div class="card stat"><span>Seiten</span><b>${pages}</b></div><div class="card stat"><span>Ø Bewertung</span><b>${avg}</b></div><div class="card stat"><span>DNF</span><b>${data.books.filter(b=>b.status==="dnf").length}</b></div></div></main>`}
function settings(){return `<main class="app">${top("Einstellungen","BookVault")}<div class="list"><div class="card"><h3>Darstellung</h3><button class="btn" style="width:100%" onclick="data.settings.view=data.settings.view==='grid'?'list':'grid';save();render()">Ansicht: ${data.settings.view==="grid"?"Cover":"Liste"}</button></div><div class="card"><h3>Daten</h3><button class="btn" style="width:100%;margin:4px 0" onclick="exportData()">Daten exportieren</button><label class="btn" style="display:block;text-align:center;margin:4px 0">Daten importieren<input type="file" accept=".json" hidden onchange="importData(event)"></label><button class="btn danger" style="margin-top:4px" onclick="resetData()">Alle Daten löschen</button></div><div class="card"><small class="muted">BookVault V1.0.3 · Eine einzige HTML-Datei · keine externen Abhängigkeiten</small></div></div></main>`}
function sortMenu(){const x=prompt("Sortierung: added = zuletzt, title = Titel, author = Autor, rating = Bewertung",data.settings.sort);if(["added","title","author","rating"].includes(x)){data.settings.sort=x;save();render()}}
function exportData(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));a.download="bookvault-backup.json";a.click()}
function importData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!Array.isArray(x.books))throw 0;data=x;save();toast("Backup importiert");render()}catch(err){alert("Ungültiges Backup")}};r.readAsText(f)}
function resetData(){if(confirm("Alle Bücher und Einstellungen löschen?")){localStorage.removeItem(KEY);data=JSON.parse(JSON.stringify(DEFAULT));render()}}
function toast(t){const x=document.getElementById("toast");x.textContent=t;x.classList.remove("hidden");setTimeout(()=>x.classList.add("hidden"),1700)}
function boot(){try{render()}catch(e){document.getElementById("app").innerHTML=`<main class="app">${top("Startfehler","BookVault")}<div class="card"><h2>Die App konnte nicht gestartet werden.</h2><p class="muted">Technischer Fehler:</p><pre style="white-space:pre-wrap">${esc(e.stack||e.message||e)}</pre><button class="btn primary" style="width:100%" onclick="location.reload()">Neu laden</button></div></main>`;console.error(e)}}
boot();
</script>
</body>
</html>
