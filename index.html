<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#9ad8c4">
<title>BookVault V1.1</title>
<style>
:root{
  --bg:#f5faf8;--panel:#fff;--soft:#e9f7f2;--text:#24332e;--muted:#71827b;
  --accent:#9ad8c4;--dark:#4d9b82;--line:#d8e7e1;--danger:#d46a75;--gold:#d6a83d;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:96px}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{max-width:760px;margin:auto;padding:calc(env(safe-area-inset-top) + 8px) 16px 24px}
.top{display:flex;justify-content:space-between;align-items:center;padding:12px 0 16px}
.eyebrow{font-size:12px;color:var(--muted)}
.title{font-size:28px;font-weight:800}
.icon,.btn,.pill,.chip{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:14px}
.icon{width:44px;height:44px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:15px}
.stat span{font-size:12px;color:var(--muted)}
.stat b{display:block;font-size:27px;margin-top:5px}
.section{margin:22px 0}
.section h2{font-size:18px}
.sectionhead{display:flex;justify-content:space-between;align-items:center}
.link{color:var(--dark);background:none;border:0}
.bookrow{display:flex;gap:12px;overflow:auto;padding-bottom:3px}
.cover{width:94px;height:136px;border-radius:10px;object-fit:cover;background:var(--soft);display:block}
.cover.sm{width:64px;height:92px}
.cover.lg{width:160px;height:232px;margin:auto}
.placeholder{display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;font-weight:700;color:#4c7567}
.mini{min-width:94px;text-align:left;background:none;border:0;color:var(--text);padding:0}
.mini b{display:block;font-size:12px;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini small,.muted{color:var(--muted)}
.hero{display:flex;gap:14px;align-items:center;background:linear-gradient(135deg,var(--soft),#fff);border:1px solid var(--line);border-radius:20px;padding:15px}
.hero h3{margin:0}
.progress{height:7px;background:#dcebe5;border-radius:99px;overflow:hidden;margin:10px 0}
.progress i{display:block;height:100%;background:var(--dark)}
.pillrow,.chips,.filters{display:flex;gap:7px;flex-wrap:wrap}
.pill,.chip{padding:8px 11px;font-size:12px}
.pill.active,.chip.selected,.btn.primary{background:var(--accent);color:#183b31;border-color:var(--accent);font-weight:750}
.input,.select,.textarea{width:100%;padding:13px;border-radius:14px;border:1px solid var(--line);background:#fff;color:var(--text);outline:0}
.textarea{min-height:110px;resize:vertical}
.filters{overflow:auto;flex-wrap:nowrap;margin:10px 0}
.toolbar{display:flex;gap:8px;margin:10px 0}
.toolbar>*{flex:1}
.btn{padding:12px 14px;text-align:center}
.list{display:flex;flex-direction:column;gap:9px}
.item{width:100%;display:flex;gap:12px;text-align:left;padding:12px;background:var(--panel);border:1px solid var(--line);border-radius:17px;color:var(--text)}
.item .details{min-width:0;flex:1}
.item h3{margin:0 0 4px;font-size:16px}
.item p{margin:3px 0;font-size:12px;color:var(--muted)}
.stars{font-size:29px;letter-spacing:1px}
.stars button{font-size:29px;border:0;background:none;color:#b8c5bf;padding:0}
.stars button.on{color:var(--gold)}
.form{display:flex;flex-direction:column;gap:14px}
.field label{display:block;font-size:12px;color:#52625c;margin-bottom:7px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;background:var(--soft);padding:5px;border-radius:14px}
.seg.three{grid-template-columns:repeat(3,1fr)}
.seg button{padding:9px 3px;border:0;border-radius:10px;background:transparent;color:var(--muted);font-size:11px}
.seg button.sel{background:var(--accent);color:#183b31}
.detail{text-align:center}
.danger{background:#fdebed;color:#9b3744;border-color:#f2cbd0}
.lookup{background:var(--soft);border:1px solid var(--line);border-radius:16px;padding:12px}
.lookup .row{display:flex;gap:8px;align-items:center}
.lookup .grow{flex:1}
.lookup-status{font-size:12px;margin-top:8px;line-height:1.4}
.lookup-status.ok{color:#2d7b64}
.lookup-status.error{color:#b24c59}
.lookup-status.info{color:var(--muted)}
.bottom{position:fixed;z-index:10;left:0;right:0;bottom:0;background:#ffffffee;backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
.nav{max-width:760px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.nav button{border:0;background:transparent;padding:6px 2px;font-size:10px;color:var(--muted)}
.nav button.active{background:var(--soft);color:var(--dark)}
.nav strong{display:block;font-size:19px}
.empty{text-align:center;padding:35px 15px;color:var(--muted);border:1px dashed var(--line);border-radius:18px}
.toast{position:fixed;z-index:50;left:50%;bottom:105px;transform:translateX(-50%);background:#24332e;color:#fff;padding:11px 15px;border-radius:13px;font-weight:700;font-size:13px}
.hidden{display:none!important}
.note{font-size:12px;line-height:1.5}
@media(min-width:620px){.grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<div id="app"></div>
<div class="bottom"><div class="nav" id="nav"></div></div>
<div id="toast" class="toast hidden"></div>

<script>
"use strict";
(function(){

const KEY="bookvault_v104";

const DEF={
  books:[],
  genres:["Dark Romance","Romance","Romantasy","Fantasy","Thriller","Krimi","Mystery","Science Fiction","Horror","Historisch","New Adult","Young Adult","Contemporary","Sonstiges"],
  tropes:["Enemies to Lovers","Friends to Lovers","Forced Proximity","Morally Grey","Slow Burn","Found Family","Fake Dating","Second Chance","Forbidden Love","Mafia","Possessive MMC","Grumpy × Sunshine"],
  settings:{view:"grid",sort:"added"}
};

let data=load();
let state={screen:"home",filter:"all",query:"",bookId:null,editingId:null,seriesName:null};

function clone(x){return JSON.parse(JSON.stringify(x));}

function load(){
  try{
    const x=JSON.parse(localStorage.getItem(KEY)||"null");
    if(!x||!Array.isArray(x.books))return clone(DEF);
    x.genres=Array.isArray(x.genres)?x.genres:clone(DEF.genres);
    x.tropes=Array.isArray(x.tropes)?x.tropes:clone(DEF.tropes);
    x.settings=x.settings||clone(DEF.settings);
    return x;
  }catch(e){return clone(DEF);}
}

function save(){
  try{localStorage.setItem(KEY,JSON.stringify(data));return true;}
  catch(e){toast("Speichern nicht möglich");return false;}
}

function esc(v){
  return String(v==null?"":v).replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c];
  });
}

function uid(){return Date.now().toString(36)+"_"+Math.random().toString(36).slice(2)}
function own(v){return{owned:"🏠 In meinem Besitz",borrowed:"🤝 Ausgeliehen",kindleUnlimited:"📱 Kindle Unlimited"}[v]||"🏠 In meinem Besitz"}
function status(v){return{unread:"Ungelesen",reading:"Reading",read:"Gelesen",dnf:"DNF"}[v]||"Ungelesen"}
function purchase(v){return{wanted:"🛒 Möchte ich kaufen",purchased:"✓ Gekauft"}[v]||""}
function stars(n){n=Number(n)||0;return[1,2,3,4,5].map(i=>i<=n?"★":"☆").join("")}
function owned(){return data.books.filter(b=>b.ownership==="owned").length}

function toast(t){
  const e=document.getElementById("toast");
  e.textContent=t;e.classList.remove("hidden");
  clearTimeout(window.tt);window.tt=setTimeout(()=>e.classList.add("hidden"),1800);
}

function cover(b,c=""){
  return b.cover
    ?'<img class="cover '+c+'" src="'+esc(b.cover)+'" alt="">'
    :'<div class="cover placeholder '+c+'">📖</div>';
}

function top(t,s){
  return'<div class="top"><div><div class="eyebrow">'+esc(s||"")+'</div><div class="title">'+esc(t)+'</div></div>'+
    (t==="Home"?"":'<button class="icon" data-a="home" aria-label="Home">⌂</button>')+'</div>';
}

function stat(l,n){return'<div class="card stat"><span>'+esc(l)+'</span><b>'+n+'</b></div>'}
function mini(b){return'<button class="mini" data-open="'+esc(b.id)+'">'+cover(b)+'<b>'+esc(b.title)+'</b><small>'+esc(b.author)+'</small></button>'}

function nav(){
  return[["home","⌂","Home"],["library","▦","Bibliothek"],["add","＋","Hinzufügen"],["series","▤","Reihen"],["more","⋯","Mehr"]]
    .map(x=>'<button class="'+((state.screen===x[0]||(x[0]==="add"&&state.screen==="form"))?"active":"")+'" data-nav="'+x[0]+'"><strong>'+x[1]+'</strong>'+x[2]+'</button>').join("");
}

function render(){
  document.getElementById("nav").innerHTML=nav();
  const a=document.getElementById("app");
  try{
    a.innerHTML=
      state.screen==="home"?home():
      state.screen==="library"?library():
      state.screen==="detail"?detail():
      state.screen==="form"?form(state.editingId):
      state.screen==="series"?series():
      state.screen==="seriesDetail"?seriesDetail():
      state.screen==="more"?more():
      state.screen==="favorites"?favorites():
      state.screen==="stats"?stats():
      state.screen==="settings"?settings():home();
  }catch(e){
    console.error(e);
    a.innerHTML='<main class="app">'+top("BookVault","Fehler")+
      '<div class="card"><h2>Die Ansicht konnte nicht geladen werden.</h2><p class="muted">Bitte gehe zurück zu Home.</p><button class="btn primary" data-a="home">Home öffnen</button></div></main>';
  }
}

function home(){
  const r=data.books.slice().sort((a,b)=>new Date(b.createdAt||0)-new Date(a.createdAt||0)).slice(0,8);
  const f=data.books.filter(b=>b.favorite).slice(0,8);
  const rd=data.books.find(b=>b.status==="reading");
  return'<main class="app">'+top("Home","BookVault V1.1")+
    '<div class="grid">'+stat("In meinem Besitz",owned())+stat("Katalogisiert",data.books.length)+
    stat("Gelesen",data.books.filter(b=>b.status==="read").length)+stat("Ungelesen",data.books.filter(b=>b.status==="unread").length)+'</div>'+
    (rd?'<section class="section"><div class="sectionhead"><h2>Aktuell gelesen</h2><button class="link" data-open="'+esc(rd.id)+'">Öffnen →</button></div>'+
      '<div class="hero">'+cover(rd,"sm")+'<div><h3>'+esc(rd.title)+'</h3><div class="muted">'+esc(rd.author)+'</div>'+
      '<div class="progress"><i style="width:'+Math.min(100,+rd.progress||0)+'%"></i></div></div></div></section>':"")+
    '<section class="section"><div class="sectionhead"><h2>Zuletzt hinzugefügt</h2><button class="link" data-nav="library">Alle →</button></div>'+
    (r.length?'<div class="bookrow">'+r.map(mini).join("")+'</div>':'<div class="empty">Noch keine Bücher.</div>')+'</section>'+
    '<section class="section"><div class="sectionhead"><h2>Favoriten</h2><button class="link" data-nav="favorites">Alle →</button></div>'+
    (f.length?'<div class="bookrow">'+f.map(mini).join("")+'</div>':'<div class="empty">Noch keine Favoriten.</div>')+'</section>'+
    '<div class="card"><b>📚 '+(data.books.length-owned())+' Bücher nicht im Besitz</b><p class="muted">Ausgeliehene und Kindle-Unlimited-Bücher sind sichtbar, zählen aber nicht zum Besitz.</p></div>'+
    '</main>';
}

function books(){
  let a=data.books.slice(),q=state.query.trim().toLowerCase();
  if(state.filter==="owned")a=a.filter(b=>b.ownership==="owned");
  if(state.filter==="borrowed")a=a.filter(b=>b.ownership==="borrowed");
  if(state.filter==="ku")a=a.filter(b=>b.ownership==="kindleUnlimited");
  if(state.filter==="wanted")a=a.filter(b=>b.purchaseStatus==="wanted");
  if(state.filter==="favorites")a=a.filter(b=>b.favorite===true);
  if(["read","unread","reading","dnf"].includes(state.filter))a=a.filter(b=>b.status===state.filter);
  if(q)a=a.filter(b=>[b.title,b.author,b.seriesName,b.review,b.notes,...(b.genres||[]),...(b.tropes||[])].join(" ").toLowerCase().includes(q));
  const s=data.settings.sort;
  a.sort((x,y)=>s==="title"?String(x.title).localeCompare(String(y.title),"de"):
    s==="author"?String(x.author).localeCompare(String(y.author),"de"):
    s==="rating"?(+y.rating||0)-(+x.rating||0):
    new Date(y.createdAt||0)-new Date(x.createdAt||0));
  return a;
}

function item(b){
  return'<button class="item" data-open="'+esc(b.id)+'">'+cover(b,"sm")+
    '<div class="details"><h3>'+esc(b.title)+'</h3><p>'+esc(b.author)+'</p>'+
    '<p>'+stars(b.rating)+' · '+status(b.status)+'</p>'+
    '<p>'+own(b.ownership)+(purchase(b.purchaseStatus)?" · "+purchase(b.purchaseStatus):"")+(b.favorite?" · ❤️ Favorit":"")+'</p></div></button>';
}

function library(){
  const bs=books(),fs=[["all","Alle"],["owned","Besitz"],["borrowed","Ausgeliehen"],["ku","KU"],["wanted","🛒 Kaufliste"],["favorites","❤️ Favoriten"],["read","Gelesen"],["unread","Ungelesen"],["reading","Reading"],["dnf","DNF"]];
  return'<main class="app">'+top("Bibliothek",data.books.length+" katalogisiert · "+owned()+" im Besitz")+
    '<input id="search" class="input" value="'+esc(state.query)+'" placeholder="Titel, Autor, Reihe, Trope…">'+
    '<div class="filters">'+fs.map(f=>'<button class="pill '+(state.filter===f[0]?"active":"")+'" data-filter="'+f[0]+'">'+f[1]+'</button>').join("")+'</div>'+
    '<div class="toolbar"><button class="btn" data-a="view">'+(data.settings.view==="grid"?"☷ Liste":"▦ Cover")+'</button><button class="btn" data-a="sort">↕ Sortieren</button></div>'+
    (bs.length?(data.settings.view==="grid"
      ?'<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px">'+bs.map(b=>'<button style="text-align:left;background:none;border:0;color:var(--text);padding:0" data-open="'+b.id+'">'+cover(b)+'<b style="display:block;font-size:12px;margin-top:5px">'+esc(b.title)+'</b><small class="muted">'+esc(b.author)+'</small></button>').join("")+'</div>'
      :'<div class="list">'+bs.map(item).join("")+'</div>')
      :'<div class="empty">Keine Bücher gefunden.</div>')+
    '</main>';
}

function series(){
  const m={};data.books.forEach(b=>{if(b.seriesName)(m[b.seriesName]??=[]).push(b)});
  const n=Object.keys(m).sort((a,b)=>a.localeCompare(b,"de"));
  return'<main class="app">'+top("Reihen","Deine Reihen")+
    (n.length?'<div class="list">'+n.map(x=>'<button class="item" data-series="'+esc(x)+'"><div class="cover sm placeholder">📚</div><div class="details"><h3>'+esc(x)+'</h3><p>'+m[x].length+' Bände · '+m[x].filter(b=>b.status==="read").length+' gelesen</p></div></button>').join("")
    :'<div class="empty">Noch keine Reihen.</div>')+'</main>';
}

function seriesDetail(){
  const bs=data.books.filter(b=>b.seriesName===state.seriesName).sort((a,b)=>(+a.volume||999)-(+b.volume||999));
  return'<main class="app">'+top(state.seriesName||"Reihe","Reihe")+'<div class="list">'+bs.map(item).join("")+'</div></main>';
}

function detail(){
  const b=data.books.find(x=>x.id===state.bookId);
  if(!b){state.screen="library";return library()}
  return'<main class="app">'+top("Buch","Bibliothek")+
    '<div class="detail">'+cover(b,"lg")+'<h1>'+esc(b.title)+'</h1><div class="muted">'+esc(b.author)+'</div>'+
    '<div class="stars">'+stars(b.rating)+'</div>'+
    '<div class="pillrow" style="justify-content:center;margin:10px 0">'+
    [own(b.ownership),status(b.status),purchase(b.purchaseStatus),b.favorite?"❤️ Favorit":""].filter(Boolean).map(x=>'<span class="pill active">'+esc(x)+'</span>').join("")+'</div>'+
    (b.seriesName?'<p class="muted">'+esc(b.seriesName)+(b.volume?' · Band '+b.volume:"")+'</p>':"")+
    '<div class="toolbar"><button class="btn primary" data-a="edit">Bearbeiten</button><button class="btn" data-a="buy">'+(b.purchaseStatus==="wanted"?"✓ Als gekauft":"🛒 Möchte ich kaufen")+'</button></div></div>'+
    '<section class="section"><h2>Informationen</h2><div class="card">'+(b.pageCount||"—")+' Seiten · '+esc(b.language||"Deutsch")+' · '+esc(b.format||"E-Book")+
    (b.publisher||b.publicationYear?'<p class="muted">'+esc(b.publisher||"")+(b.publicationYear?" · "+b.publicationYear:"")+'</p>':"")+
    (b.isbn?'<p class="muted">ISBN: '+esc(b.isbn)+'</p>':"")+'</div></section>'+
    '<section class="section"><h2>Genres & Tropes</h2><div class="pillrow">'+[...(b.genres||[]),...(b.tropes||[])].map(x=>'<span class="pill">'+esc(x)+'</span>').join("")+'</div></section>'+
    '<section class="section"><h2>Meine Rezension</h2><div class="card">'+(b.review?esc(b.review).replace(/\n/g,"<br>"):'<span class="muted">Keine Rezension.</span>')+'</div></section>'+
    '<section class="section"><h2>Notizen</h2><div class="card">'+(b.notes?esc(b.notes).replace(/\n/g,"<br>"):'<span class="muted">Keine Notizen.</span>')+'</div></section>'+
    '<button class="btn danger" style="width:100%" data-a="delete">Buch löschen</button></main>';
}

function field(id,l,v,t,req){
  return'<div class="field"><label>'+esc(l)+(req?' *':'')+'</label><input id="'+id+'" class="input" type="'+(t||"text")+'" '+(req?'required':'')+' value="'+esc(v||"")+'"></div>';
}

function seg(l,id,v,o){
  return'<div class="field"><label>'+l+'</label><div class="seg '+(o.length===3?'three':'')+'">'+
    o.map(x=>'<button type="button" class="'+(v===x[0]?'sel':'')+'" data-seg="'+id+'" data-val="'+esc(x[0])+'">'+x[1]+'</button>').join("")+
    '</div><input id="'+id+'" type="hidden" value="'+esc(v||"")+'"></div>';
}

function chips(g,arr,sel){
  return'<div class="chips">'+arr.map(x=>'<button type="button" class="chip '+(sel.includes(x)?'selected':'')+'" data-chip="'+g+'" data-val="'+esc(x)+'">'+esc(x)+'</button>').join("")+'</div>';
}

function form(id){
  const b=id?data.books.find(x=>x.id===id):{
    ownership:"owned",status:"unread",rating:0,favorite:false,purchaseStatus:"none",
    language:"Deutsch",format:"E-Book",genres:[],tropes:[],progress:0,currentPage:0
  };
  if(!b)return library();
  const seriesNames=[...new Set(data.books.map(x=>x.seriesName).filter(Boolean))].sort((a,c)=>a.localeCompare(c,"de"));

  return'<main class="app">'+top(id?'Bearbeiten':'Buch hinzufügen',"Bibliothek")+
  '<form class="form" id="bookForm">'+

  '<div class="lookup"><b>⚡ ISBN-Autovervollständigung</b>'+
  '<p class="muted" style="font-size:12px">ISBN-10 oder ISBN-13 eingeben → prüfen → Buchdaten automatisch abrufen.</p>'+
  '<div class="row"><input id="isbnLookup" class="input grow" inputmode="text" autocomplete="off" placeholder="ISBN-10 oder ISBN-13">'+
  '<button type="button" class="btn primary" data-a="isbn">Abrufen</button></div>'+
  '<div id="isbnMsg" class="lookup-status info"></div></div>'+

  '<div class="field"><label>Cover</label>'+
  '<label class="btn" style="display:block;text-align:center">📷 Cover aus Fotos auswählen<input id="coverFile" type="file" accept="image/*" hidden></label>'+
  '<input id="cover" class="input" value="'+esc(b.cover||"")+'" placeholder="oder Bild-URL" style="margin-top:8px">'+
  '<div id="preview" style="margin-top:8px">'+(b.cover?'<img src="'+esc(b.cover)+'" style="width:75px;height:110px;object-fit:cover;border-radius:9px">':"")+'</div></div>'+

  field("title","Titel",b.title,true)+field("author","Autor",b.author,true)+field("subtitle","Untertitel",b.subtitle)+field("isbn","ISBN",b.isbn)+
  '<div class="two">'+field("publisher","Verlag",b.publisher)+field("publicationYear","Erscheinungsjahr",b.publicationYear,"number")+'</div>'+
  '<div class="two">'+field("pageCount","Seitenzahl",b.pageCount,"number")+
  '<div class="field"><label>Sprache</label><select id="language" class="select">'+["Deutsch","Englisch","Französisch","Spanisch","Andere"].map(x=>'<option '+(b.language===x?"selected":"")+'>'+x+'</option>').join("")+'</select></div></div>'+
  '<div class="field"><label>Format</label><select id="format" class="select">'+["E-Book","Taschenbuch","Hardcover","Hörbuch","Sonstiges"].map(x=>'<option '+(b.format===x?"selected":"")+'>'+x+'</option>').join("")+'</select></div>'+
  seg("Besitzstatus","ownership",b.ownership,[["owned","🏠 Besitz"],["borrowed","🤝 Ausgeliehen"],["kindleUnlimited","📱 KU"]])+
  '<div class="two">'+field("borrowedFrom","Ausgeliehen von",b.borrowedFrom)+field("returnDue","Rückgabe",b.returnDue,"date")+'</div>'+
  '<div class="field"><label>Reihe</label><select id="seriesName" class="select"><option value="">Keine Reihe</option>'+

/* ---------------- ISBN ---------------- */

function cleanISBN(value){
  return String(value||"").replace(/[\s\-–—.]/g,"").replace(/[^\dXx]/g,"").toUpperCase();
}

function validISBN10(isbn){
  if(!/^\d{9}[\dX]$/.test(isbn))return false;
  let sum=0;
  for(let i=0;i<10;i++){
    const n=isbn[i]==="X"?10:Number(isbn[i]);
    sum+=(10-i)*n;
  }
  return sum%11===0;
}

function validISBN13(isbn){
  if(!/^\d{13}$/.test(isbn))return false;
  let sum=0;
  for(let i=0;i<12;i++)sum+=Number(isbn[i])*(i%2?3:1);
  return (10-(sum%10))%10===Number(isbn[12]);
}

function isbn10to13(isbn10){
  const base="978"+isbn10.slice(0,9);
  let sum=0;
  for(let i=0;i<12;i++)sum+=Number(base[i])*(i%2?3:1);
  return base+String((10-(sum%10))%10);
}

function isbn13to10(isbn13){
  if(!isbn13.startsWith("978"))return "";
  const base=isbn13.slice(3,12);
  let sum=0;
  for(let i=0;i<9;i++)sum+=(10-i)*Number(base[i]);
  const rem=11-(sum%11);
  const check=rem===10?"X":rem===11?"0":String(rem);
  return base+check;
}

function normalizeISBN(value){
  const raw=cleanISBN(value);
  if(raw.length===10){
    if(!validISBN10(raw))return {error:"Die eingegebene ISBN-10 ist ungültig (Prüfziffer)."};
    return {input:raw,isbn10:raw,isbn13:isbn10to13(raw)};
  }
  if(raw.length===13){
    if(!validISBN13(raw))return {error:"Die eingegebene ISBN-13 ist ungültig (Prüfziffer)."};
    return {input:raw,isbn13:raw,isbn10:isbn13to10(raw)};
  }
  return {error:"Bitte eine vollständige ISBN-10 (10 Zeichen) oder ISBN-13 (13 Zeichen) eingeben."};
}

async function fetchJSON(url,timeout=9000){
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),timeout);
  try{
    const response=await fetch(url,{method:"GET",headers:{Accept:"application/json"},signal:controller.signal});
    if(!response.ok)throw new Error("HTTP "+response.status);
    return await response.json();
  }finally{clearTimeout(timer);}
}

async function googleBooks(isbn13,isbn10){
  /*
    Google Books ist nicht bei jeder deutschen Ausgabe über q=isbn:
    vollständig indexiert. Deshalb probieren wir mehrere Suchvarianten
    und akzeptieren einen Treffer nur dann, wenn die ISBN wirklich
    zum Treffer gehört.
  */
  const queries=[
    "isbn:"+isbn13,
    isbn13,
    isbn10
  ].filter(Boolean);

  for(const q of queries){
    try{
      const d=await fetchJSON(
        "https://www.googleapis.com/books/v1/volumes?q="+encodeURIComponent(q)+"&maxResults=20"
      );
      const items=Array.isArray(d.items)?d.items:[];

      const hit=items.find(item=>{
        const ids=item.volumeInfo?.industryIdentifiers||[];
        return ids.some(x=>{
          const id=cleanISBN(x.identifier);
          return id===isbn13 || id===isbn10;
        });
      });

      if(!hit?.volumeInfo)continue;

      const v=hit.volumeInfo;
      const ids=v.industryIdentifiers||[];
      const found13=ids.find(x=>cleanISBN(x.identifier).length===13)?.identifier;
      const found10=ids.find(x=>cleanISBN(x.identifier).length===10)?.identifier;

      return {
        title:v.title||"",
        subtitle:v.subtitle||"",
        author:(v.authors||[]).join(", "),
        publisher:v.publisher||"",
        published:v.publishedDate||"",
        pages:v.pageCount||"",
        language:v.language||"",
        isbn13:found13?cleanISBN(found13):isbn13,
        isbn10:found10?cleanISBN(found10):isbn10,
        cover:v.imageLinks?.thumbnail?.replace(/^http:/,"https:")||""
      };
    }catch(e){}
  }
  return null;
}

async function openLibraryEdition(isbn){
  try{
    const d=await fetchJSON(
      "https://openlibrary.org/isbn/"+encodeURIComponent(isbn)+".json",
      10000
    );

    if(!d || !d.title)return null;

    const authors=[];
    for(const a of (d.authors||[])){
      if(!a?.key)continue;
      try{
        const ad=await fetchJSON("https://openlibrary.org"+a.key+".json",7000);
        if(ad?.name)authors.push(ad.name);
      }catch(e){}
    }

    const publishers=(d.publishers||[]).map(x=>{
      if(typeof x==="string")return x;
      return x?.name||"";
    }).filter(Boolean);

    return {
      title:d.title||"",
      subtitle:"",
      author:authors.join(", "),
      publisher:publishers[0]||"",
      published:d.publish_date||"",
      pages:d.number_of_pages||"",
      language:"",
      isbn13:isbn.length===13?isbn:"",
      isbn10:isbn.length===10?isbn:"",
      cover:d.covers?.[0]?
        "https://covers.openlibrary.org/b/id/"+d.covers[0]+"-L.jpg":""
    };
  }catch(e){
    return null;
  }
}

async function openLibrarySearch(isbn13,isbn10){
  const queries=[isbn13,isbn10].filter(Boolean);

  for(const q of queries){
    try{
      const d=await fetchJSON(
        "https://openlibrary.org/search.json?isbn="+encodeURIComponent(q)+"&limit=20",
        10000
      );
      const docs=Array.isArray(d.docs)?d.docs:[];

      const hit=docs.find(doc=>{
        const ids=(doc.isbn||[]).map(cleanISBN);
        return ids.includes(isbn13)||ids.includes(isbn10);
      });

      if(!hit)continue;

      const ids=(hit.isbn||[]).map(cleanISBN);
      return {
        title:hit.title||"",
        subtitle:"",
        author:(hit.author_name||[]).join(", "),
        publisher:hit.publisher?.[0]||"",
        published:hit.first_publish_year?String(hit.first_publish_year):"",
        pages:hit.number_of_pages_median||"",
        language:"",
        isbn13:ids.find(x=>x===isbn13)||ids.find(x=>x.length===13)||isbn13,
        isbn10:ids.find(x=>x===isbn10)||ids.find(x=>x.length===10)||isbn10,
        cover:hit.cover_i?
          "https://covers.openlibrary.org/b/id/"+hit.cover_i+"-L.jpg":""
      };
    }catch(e){}
  }
  return null;
}

async function openLibrary(isbn13,isbn10){
  /*
    Erst die konkrete Edition abfragen, dann die Suchdatenbank.
    Das ist besonders wichtig bei deutschsprachigen Ausgaben, die
    in der Suchdatenbank nicht immer zuverlässig über ?isbn= auftauchen.
  */
  const direct13=isbn13?await openLibraryEdition(isbn13):null;
  if(direct13)return direct13;

  const direct10=isbn10?await openLibraryEdition(isbn10):null;
  if(direct10)return direct10;

  return await openLibrarySearch(isbn13,isbn10);
}

function mergeBookData(d,n){
  const out={
    title:d.title||"",
    author:d.author||"",
    subtitle:d.subtitle||"",
    publisher:d.publisher||"",
    publicationYear:(d.published||"").slice(0,4),
    pageCount:d.pages||"",
    language:d.language||"",
    isbn:d.isbn13||n.isbn13||n.isbn10||n.input,
    cover:d.cover||""
  };
  return out;
}

async function isbn(){
  const input=document.getElementById("isbnLookup");
  const msg=document.getElementById("isbnMsg");
  const value=input?.value||"";
  const n=normalizeISBN(value);

  msg.className="lookup-status";
  if(n.error){
    msg.classList.add("error");
    msg.textContent="⚠️ "+n.error;
    return;
  }

  msg.classList.add("info");
  msg.textContent="🔎 ISBN geprüft. Buchdaten werden abgerufen …";

  try{
    let d=await googleBooks(n.isbn13,n.isbn10);
    if(!d)d=await openLibrary(n.isbn13,n.isbn10);

    if(!d){
      msg.className="lookup-status error";
      msg.textContent="ISBN ist gültig, aber Google Books und Open Library liefern für diese Ausgabe keinen Datensatz. Bitte erneut versuchen.";
      return;
    }

    const b=mergeBookData(d,n);
    for(const [id,v] of Object.entries(b)){
      const el=document.getElementById(id);
      if(el)el.value=v??"";
    }

    if(d.cover){
      const p=document.getElementById("preview");
      if(p)p.innerHTML='<img src="'+esc(d.cover)+'" style="width:75px;height:110px;object-fit:cover;border-radius:9px">';
    }

    msg.className="lookup-status ok";
    msg.textContent="✓ Buchdaten gefunden. Bitte prüfen und speichern.";
  }catch(e){
    msg.className="lookup-status error";
    msg.textContent="Die ISBN ist gültig, aber die Buchdatenquelle war gerade nicht erreichbar. Bitte später erneut versuchen.";
  }
}

/* ---------------- Daten sammeln / speichern ---------------- */

function collect(){
  const old=state.editingId?data.books.find(x=>x.id===state.editingId):null;
  const b={...(old||{}),id:old?old.id:uid(),createdAt:old?.createdAt||new Date().toISOString(),updatedAt:new Date().toISOString()};

  ["title","author","subtitle","isbn","publisher","publicationYear","pageCount","language","format","ownership","borrowedFrom","returnDue","seriesName","volume","status","rating","purchaseStatus","startedAt","finishedAt","currentPage","progress","review","notes","cover"]
    .forEach(id=>{const e=document.getElementById(id);if(e)b[id]=e.value});

  const ns=document.getElementById("newSeries");
  if(ns?.value.trim())b.seriesName=ns.value.trim();

  b.pageCount=+b.pageCount||0;
  b.publicationYear=+b.publicationYear||"";
  b.volume=+b.volume||0;
  b.currentPage=+b.currentPage||0;
  b.progress=Math.max(0,Math.min(100,+b.progress||0));
  b.rating=Math.max(0,Math.min(5,+b.rating||0));
  b.favorite=document.getElementById("fav")?.classList.contains("primary")||false;
  b.genres=[...document.querySelectorAll('[data-chip="genres"].selected')].map(x=>x.dataset.val);
  b.tropes=[...document.querySelectorAll('[data-chip="tropes"].selected')].map(x=>x.dataset.val);

  const ct=document.getElementById("customTrope");
  if(ct?.value.trim()&&!b.tropes.includes(ct.value.trim()))b.tropes.push(ct.value.trim());
  if(b.purchaseStatus==="purchased")b.ownership="owned";
  return b;
}

function saveForm(){
  const f=document.getElementById("bookForm");
  if(!f.checkValidity()){f.reportValidity();return}
  const b=collect(),i=data.books.findIndex(x=>x.id===b.id);
  if(i<0)data.books.unshift(b);else data.books[i]=b;
  save();state.bookId=b.id;state.editingId=null;state.screen="detail";
  toast("Buch gespeichert");render();
}

function deleteBook(){
  const b=data.books.find(x=>x.id===state.bookId);
  if(b&&confirm("„"+b.title+"“ wirklich löschen?")){
    data.books=data.books.filter(x=>x.id!==b.id);
    save();state.screen="library";state.bookId=null;render();
  }
}

function exportData(){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));
  a.download="bookvault-backup.json";a.click();
}

function importData(file){
  if(!file)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const x=JSON.parse(r.result);
      if(!x||!Array.isArray(x.books))throw new Error("invalid");
      data=x;
      data.genres=Array.isArray(data.genres)?data.genres:clone(DEF.genres);
      data.tropes=Array.isArray(data.tropes)?data.tropes:clone(DEF.tropes);
      data.settings=data.settings||clone(DEF.settings);
      save();toast("Backup importiert");render();
    }catch(e){alert("Ungültiges Backup.")}
  };
  r.readAsText(file);
}

function sortMenu(){
  const x=prompt("Sortierung eingeben: added, title, author oder rating",data.settings.sort);
  if(["added","title","author","rating"].includes(x)){data.settings.sort=x;save();render();}
}

/* ---------------- Events ---------------- */

document.addEventListener("click",e=>{
  const n=e.target.closest("[data-nav]");
  if(n){
    const x=n.dataset.nav;
    if(x==="add"){state.editingId=null;state.screen="form";}
    else if(x==="favorites")state.screen="favorites";
    else state.screen=x;
    render();return;
  }

  const o=e.target.closest("[data-open]");
  if(o){state.bookId=o.dataset.open;state.screen="detail";render();return}

  const s=e.target.closest("[data-series]");
  if(s){state.seriesName=s.dataset.series;state.screen="seriesDetail";render();return}

  const fl=e.target.closest("[data-filter]");
  if(fl){state.filter=fl.dataset.filter;state.screen="library";render();return}

  const sg=e.target.closest("[data-seg]");
  if(sg){
    const input=document.getElementById(sg.dataset.seg);
    if(input)input.value=sg.dataset.val;
    sg.parentElement.querySelectorAll("button").forEach(x=>x.classList.remove("sel"));
    sg.classList.add("sel");return;
  }

  const ch=e.target.closest("[data-chip]");
  if(ch){ch.classList.toggle("selected");return}

  const rt=e.target.closest("[data-rate]");
  if(rt){
    const n=+rt.dataset.rate;
    const r=document.getElementById("rating");
    if(r)r.value=n;
    document.querySelectorAll("[data-rate]").forEach((x,i)=>{
      x.classList.toggle("on",i<n);x.textContent=i<n?"★":"☆";
    });
    return;
  }

  const a=e.target.closest("[data-a]");
  if(!a)return;
  const x=a.dataset.a;

  if(x==="home")state.screen="home";
  else if(x==="edit"){state.editingId=state.bookId;state.screen="form";}
  else if(x==="delete")deleteBook();
  else if(x==="fav"){
    const b=document.getElementById("fav"),on=b.classList.toggle("primary");
    b.textContent=on?"❤️ Favorit":"♡ Als Favorit markieren";
  }
  else if(x==="isbn"){ isbn(); return; }
  else if(x==="cancel"){state.screen=state.bookId?"detail":"library";state.editingId=null;}
  else if(x==="view"){data.settings.view=data.settings.view==="grid"?"list":"grid";save();}
  else if(x==="sort")sortMenu();
  else if(x==="buy"){
    const b=data.books.find(x=>x.id===state.bookId);
    if(b){
      b.purchaseStatus=b.purchaseStatus==="wanted"?"purchased":"wanted";
      if(b.purchaseStatus==="purchased")b.ownership="owned";
      save();
    }
  }
  else if(x==="wanted"){state.filter="wanted";state.screen="library";}
  else if(x==="export")exportData();
  else if(x==="reset"&&confirm("Alle Daten löschen?")){localStorage.removeItem(KEY);data=load();state.screen="home";}
  render();
});

document.addEventListener("input",e=>{
  if(e.target.id==="search"){state.query=e.target.value;render();}
});

document.addEventListener("change",e=>{
  if(e.target.id==="coverFile"){
    const f=e.target.files?.[0];
    if(f){
      const r=new FileReader();
      r.onload=()=>{
        const cover=document.getElementById("cover"),preview=document.getElementById("preview");
        if(cover)cover.value=r.result;
        if(preview)preview.innerHTML='<img src="'+r.result+'" style="width:75px;height:110px;object-fit:cover;border-radius:9px">';
      };
      r.readAsDataURL(f);
    }
  }
  if(e.target.id==="importFile")importData(e.target.files?.[0]);
});

document.addEventListener("submit",e=>{
  if(e.target.id==="bookForm"){e.preventDefault();saveForm();}
});

render();
})();
</script>
