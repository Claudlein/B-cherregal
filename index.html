<!doctype html>
<html lang="de">>
<<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#9ad8c4">
<title>BookVault 1.1.1</title>
<style>
:root{--bg:#f5faf8;--panel:#fff;--soft:#e9f7f2;--text:#24332e;--muted:#71827b;--accent:#9ad8c4;--dark:#4d9b82;--line:#d8e7e1;--danger:#d46a75;--gold:#d6a83d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
padding-bottom:90px}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.app{max-width:760px;margin:auto;
padding:calc(env(safe-area-inset-top) + 8px) 16px 24px}

.top{display:flex;justify-content:space-between;align-items:center;
padding:12px 0 16px}
.eyebrow{font-size:12px;
color:var(--muted)}
.title{font-size:28px;
font-weight:800}

.icon,.btn,.pill,.chip{border:1px solid var(--line);background:var(--panel);color:var(--text);
border-radius:14px}
.icon{width:44px;
height:44px}

.grid{display:grid;grid-template-columns:repeat(2,1fr);
gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;
padding:15px}

.stat span{font-size:12px;
color:var(--muted)}
.stat b{display:block;font-size:27px;
margin-top:5px}
.section{margin:22px 0}
.section h2{font-size:18px}

.sectionhead{display:flex;justify-content:space-between;
align-items:center}
.link{color:var(--dark);background:none;
border:0}

.bookrow{display:flex;gap:12px;
overflow:auto}
.cover{width:94px;height:136px;border-radius:10px;object-fit:cover;background:var(--soft);
display:block}
.cover.sm{width:64px;
height:92px}
.cover.lg{width:160px;height:232px;
margin:auto}

.placeholder{display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;font-weight:700;
color:#4c7567}
.mini{min-width:94px;text-align:left;background:none;border:0;color:var(--text);
padding:0}

.mini b{display:block;font-size:12px;margin-top:6px;white-space:nowrap;overflow:hidden;
text-overflow:ellipsis}
.mini small,.muted{color:var(--muted)}

.hero{display:flex;gap:14px;align-items:center;background:linear-gradient(135deg,var(--soft),#fff);border:1px solid var(--line);border-radius:20px;
padding:15px}

.hero h3{margin:0}
.progress{height:7px;background:#dcebe5;border-radius:99px;overflow:hidden;
margin:10px 0}
.progress i{display:block;height:100%;
background:var(--dark)}

.pillrow,.chips,.filters{display:flex;gap:7px;
flex-wrap:wrap}
.pill,.chip{padding:8px 11px;
font-size:12px}

.pill.active,.chip.selected,.btn.primary{background:var(--accent);color:#183b31;border-color:var(--accent);
font-weight:750}

.input,.select,.textarea{width:100%;padding:13px;border-radius:14px;border:1px solid var(--line);background:#fff;color:var(--text);
outline:0}
.textarea{min-height:110px}

.filters{overflow:auto;flex-wrap:nowrap;
margin:10px 0}
.toolbar{display:flex;gap:8px;
margin:10px 0}
.toolbar>*{flex:1}
.btn{padding:12px 14px;
text-align:center}

.list{display:flex;flex-direction:column;
gap:9px}
.item{width:100%;display:flex;gap:12px;text-align:left;padding:12px;background:var(--panel);border:1px solid var(--line);border-radius:17px;
color:var(--text)}

.item .details{min-width:0;
flex:1}
.item h3{margin:0 0 4px;
font-size:16px}
.item p{margin:3px 0;font-size:12px;
color:var(--muted)}

.stars{font-size:29px;
letter-spacing:1px}
.stars button{font-size:29px;border:0;background:none;color:#b8c5bf;
padding:0}
.stars button.on{color:var(--gold)}

.form{display:flex;flex-direction:column;
gap:14px}
.field label{display:block;font-size:12px;color:#52625c;
margin-bottom:7px}

.two{display:grid;grid-template-columns:1fr 1fr;
gap:9px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;background:var(--soft);padding:5px;
border-radius:14px}

.seg.three{grid-template-columns:repeat(3,1fr)}
.seg button{padding:9px 3px;border:0;border-radius:10px;background:transparent;color:var(--muted);
font-size:11px}
.seg button.sel{background:var(--accent);
color:#183b31}

.detail{text-align:center}
.danger{background:#fdebed;color:#9b3744;
border-color:#f2cbd0}
.empty{text-align:center;padding:35px 15px;color:var(--muted);border:1px dashed var(--line);
border-radius:18px}

.bottom{position:fixed;z-index:10;left:0;right:0;bottom:0;background:#ffffffee;backdrop-filter:blur(18px);border-top:1px solid var(--line);
padding:8px 10px calc(8px + env(safe-area-inset-bottom))}

.nav{max-width:760px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr);
gap:4px}
.nav button{border:0;background:transparent;padding:6px 2px;font-size:10px;
color:var(--muted)}

.nav button.active{background:var(--soft);
color:var(--dark)}
.nav strong{display:block;
font-size:19px}
.toast{position:fixed;z-index:50;left:50%;bottom:105px;transform:translateX(-50%);background:#24332e;color:#fff;padding:11px 15px;border-radius:13px;font-weight:700;
font-size:13px}
.hidden{display:none!important}

.note{font-size:12px;
line-height:1.5}
.lookup{background:var(--soft);border:1px solid var(--line);border-radius:16px;
padding:12px}
.row{display:flex;gap:8px;
align-items:center}
.grow{flex:1}

@media(min-width:620px){.grid{grid-template-columns:repeat(4,1fr)}}

</style>>
<</head>>
<<body>
<div id="app">>
<</div>>
<<div class="bottom">>
<<div class="nav" id="nav">>
<</div>>
<</div>>
<<div id="toast" class="toast hidden">>
<</div>
<script>
"use strict";(function(){
const KEY="bookvault_v104";

const DEF={books:[],genres:["Dark Romance","Romance","Romantasy","Fantasy","Thriller","Krimi","Mystery","Science Fiction","Horror","Historisch","New Adult","Young Adult","Contemporary","Sonstiges"],tropes:["Enemies to Lovers","Friends to Lovers","Forced Proximity","Morally Grey","Slow Burn","Found Family","Fake Dating","Second Chance","Forbidden Love","Mafia","Possessive MMC","Grumpy × Sunshine"],settings:{view:"grid",sort:"added"}};

let data=load(),state={screen:"home",filter:"all",query:"",bookId:null,editingId:null,seriesName:null};

function load(){try{let x=JSON.parse(localStorage.getItem(KEY)||"null");
if(!x||!Array.isArray(x.books))return JSON.parse(JSON.stringify(DEF));x.genres=Array.isArray(x.genres)?x.genres:DEF.genres;x.tropes=Array.isArray(x.tropes)?x.tropes:DEF.tropes;x.settings=x.settings||DEF.settings;

return x}catch(e){return JSON.parse(JSON.stringify(DEF))}}
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2)}
function own(v){return{owned:"🏠 In meinem Besitz",borrowed:"🤝 Ausgeliehen",kindleUnlimited:"📱 Kindle Unlimited"}[v]||"🏠 In meinem Besitz"}
function status(v){return{unread:"Ungelesen",reading:"Reading",read:"Gelesen",dnf:"DNF"}[v]||"Ungelesen"}
function purchase(v){return{wanted:"🛒 Möchte ich kaufen",purchased:"✓ Gekauft"}[v]||""}
function stars(n){n=+n||0;

return[1,2,3,4,5].map(i=>i<=n?"★":"☆").join("")}
function owned(){return data.books.filter(b=>b.ownership==="owned").length}
function toast(t){let e=document.getElementById("toast");e.textContent=t;e.classList.remove("hidden");clearTimeout(window.tt);
window.tt=setTimeout(()=>e.classList.add("hidden"),1800)}
function cover(b,c=""){return b.cover?'<img class="cover '+c+'" src="'+esc(b.cover)+'" alt="">':'<div class="cover placeholder '+c+'">📖</div>'}
function top(t,s){return'<div class="top">>
<<div>>
<<div class="eyebrow">'+esc(s||"")+'</div>>
<<div class="title">'+esc(t)+'</div>>
<</div>'+(t==="Home"?"":'<button class="icon" data-a="home">⌂</button>')+'</div>'}
function stat(l,n){return'<div class="card stat">>
<<span>'+esc(l)+'</span>>
<<b>'+n+'</b>>
<</div>'}
function mini(b){return'<button class="mini" data-open="'+esc(b.id)+'">'+cover(b)+'<b>'+esc(b.title)+'</b>>
<<small>'+esc(b.author)+'</small>>
<</button>'}
function nav(){return[["home","⌂","Home"],["library","▦","Bibliothek"],["add","＋","Hinzufügen"],["series","▤","Reihen"],["more","⋯","Mehr"]].map(x=>'<button class="'+((state.screen===x[0]||(x[0]==="add"&&state.screen==="form"))?"active":"")+'" data-nav="'+x[0]+'">>
<<strong>'+x[1]+'</strong>'+x[2]+'</button>').join("")}
function render(){document.getElementById("nav").innerHTML=nav();
let a=document.getElementById("app");
a.innerHTML=state.screen==="home"?home():state.screen==="library"?library():state.screen==="detail"?detail():state.screen==="form"?form(state.editingId):state.screen==="series"?series():state.screen==="seriesDetail"?seriesDetail():state.screen==="more"?more():state.screen==="favorites"?favorites():state.screen==="stats"?stats():state.screen==="settings"?settings():home()}
function home(){let r=data.books.slice().sort((a,b)=>new Date(b.createdAt||0)-new Date(a.createdAt||0)).slice(0,8),f=data.books.filter(b=>b.favorite).slice(0,8),rd=data.books.find(b=>b.status==="reading");

return'<main class="app">'+top("Home","BookVault 1.1.1")+'<div class="grid">'+stat("In meinem Besitz",owned())+stat("Katalogisiert",data.books.length)+stat("Gelesen",data.books.filter(b=>b.status==="read").length)+stat("Ungelesen",data.books.filter(b=>b.status==="unread").length)+'</div>'+(rd?'<section class="section">>
<<div class="sectionhead">>
<<h2>Aktuell gelesen</h2>>
<<button class="link" data-open="'+rd.id+'">Öffnen →</button>>
<</div>>
<<div class="hero">'+cover(rd,"sm")+'<div>>
<<h3>'+esc(rd.title)+'</h3>>
<<div class="muted">'+esc(rd.author)+'</div>>
<<div class="progress">>
<<i style="width:'+Math.min(100,+rd.progress||0)+'%">>
<</i>>
<</div>>
<</div>>
<</div>>
<</section>':"")+'<section class="section">>
<<div class="sectionhead">>
<<h2>Zuletzt hinzugefügt</h2>>
<<button class="link" data-nav="library">Alle →</button>>
<</div>'+(r.length?'<div class="bookrow">'+r.map(mini).join("")+'</div>':'<div class="empty">Noch keine Bücher.</div>')+'</section>>
<<section class="section">>
<<div class="sectionhead">>
<<h2>Favoriten</h2>>
<<button class="link" data-nav="favorites">Alle →</button>>
<</div>'+(f.length?'<div class="bookrow">'+f.map(mini).join("")+'</div>':'<div class="empty">Noch keine Favoriten.</div>')+'</section>>
<<div class="card">>
<<b>📚 '+(data.books.length-owned())+' Bücher nicht im Besitz</b>>
<<p class="muted">Ausgeliehene und Kindle-Unlimited-Bücher sind sichtbar, zählen aber nicht zum Besitz.</p>>
<</div>>
<</main>'}
function books(){let a=data.books.slice(),q=state.query.toLowerCase();
if(state.filter==="owned")a=a.filter(b=>b.ownership==="owned");
if(state.filter==="borrowed")a=a.filter(b=>b.ownership==="borrowed");
if(state.filter==="ku")a=a.filter(b=>b.ownership==="kindleUnlimited");
if(state.filter==="wanted")a=a.filter(b=>b.purchaseStatus==="wanted");
if(state.filter==="favorites")a=a.filter(b=>b.favorite);
if(["read","unread","reading","dnf"].includes(state.filter))a=a.filter(b=>b.status===state.filter);
if(q)a=a.filter(b=>[b.title,b.author,b.seriesName,b.review,b.notes,...(b.genres||[]),...(b.tropes||[])].join(" ").toLowerCase().includes(q));
let s=data.settings.sort;a.sort((x,y)=>s==="title"?String(x.title).localeCompare(String(y.title),"de"):s==="author"?String(x.author).localeCompare(String(y.author),"de"):s==="rating"?(+y.rating||0)-(+x.rating||0):new Date(y.createdAt||0)-new Date(x.createdAt||0));

return a}
function item(b){return'<button class="item" data-open="'+b.id+'">'+cover(b,"sm")+'<div class="details">>
<<h3>'+esc(b.title)+'</h3>>
<<p>'+esc(b.author)+'</p>>
<<p>'+stars(b.rating)+' · '+status(b.status)+'</p>>
<<p>'+own(b.ownership)+(purchase(b.purchaseStatus)?" · "+purchase(b.purchaseStatus):"")+(b.favorite?" · ❤️ Favorit":"")+'</p>>
<</div>>
<</button>'}
function library(){let bs=books(),fs=[["all","Alle"],["owned","Besitz"],["borrowed","Ausgeliehen"],["ku","KU"],["wanted","🛒 Kaufliste"],["favorites","❤️ Favoriten"],["read","Gelesen"],["unread","Ungelesen"],["reading","Reading"],["dnf","DNF"]];
return'<main class="app">'+top("Bibliothek",data.books.length+" katalogisiert · "+owned()+" im Besitz")+'<input id="search" class="input" value="'+esc(state.query)+'" placeholder="Titel, Autor, Reihe, Trope…">>
<<div class="filters">'+fs.map(f=>'<button class="pill '+(state.filter===f[0]?"active":"")+'" data-filter="'+f[0]+'">'+f[1]+'</button>').join("")+'</div>>
<<div class="toolbar">>
<<button class="btn" data-a="view">'+(data.settings.view==="grid"?"☷ Liste":"▦ Cover")+'</button>>
<<button class="btn" data-a="sort">↕ Sortieren</button>>
<</div>'+(bs.length?(data.settings.view==="grid"?'<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px">'+bs.map(b=>'<button style="text-align:left;background:none;border:0;color:var(--text);padding:0" data-open="'+b.id+'">'+cover(b)+'<b style="display:block;font-size:12px;
margin-top:5px">'+esc(b.title)+'</b>>
<<small class="muted">'+esc(b.author)+'</small>>
<</button>').join("")+'</div>':'<div class="list">'+bs.map(item).join("")+'</div>'):'<div class="empty">Keine Bücher gefunden.</div>')+'</main>'}
function series(){let m={};
data.books.forEach(b=>{if(b.seriesName)(m[b.seriesName]??=[]).push(b)});
let n=Object.keys(m).sort((a,b)=>a.localeCompare(b,"de"));

return'<main class="app">'+top("Reihen","Deine Reihen")+(n.length?'<div class="list">'+n.map(x=>'<button class="item" data-series="'+esc(x)+'">>
<<div class="cover sm placeholder">📚</div>>
<<div class="details">>
<<h3>'+esc(x)+'</h3>>
<<p>'+m[x].length+' Bände · '+m[x].filter(b=>b.status==="read").length+' gelesen</p>>
<</div>>
<</button>').join("")+'</div>':'<div class="empty">Noch keine Reihen.</div>')+'</main>'}
function seriesDetail(){return'<main class="app">'+top(state.seriesName,"Reihe")+'<div class="list">'+data.books.filter(b=>b.seriesName===state.seriesName).sort((a,b)=>(+a.volume||999)-(+b.volume||999)).map(item).join("")+'</div>>
<</main>'}
function detail(){let b=data.books.find(x=>x.id===state.bookId);

if(!b){state.screen="library";
return library()}return'<main class="app">'+top("Buch","Bibliothek")+'<div class="detail">'+cover(b,"lg")+'<h1>'+esc(b.title)+'</h1>>
<<div class="muted">'+esc(b.author)+'</div>>
<<div class="stars">'+stars(b.rating)+'</div>>
<<div class="pillrow" style="justify-content:center;
margin:10px 0">'+[own(b.ownership),status(b.status),purchase(b.purchaseStatus),b.favorite?"❤️ Favorit":""].filter(Boolean).map(x=>'<span class="pill active">'+esc(x)+'</span>').join("")+'</div>'+(b.seriesName?'<p class="muted">'+esc(b.seriesName)+(b.volume?' · Band '+b.volume:"")+'</p>':"")+'<div class="toolbar">>
<<button class="btn primary" data-a="edit">Bearbeiten</button>>
<<button class="btn" data-a="buy">'+(b.purchaseStatus==="wanted"?"✓ Als gekauft":"🛒 Möchte ich kaufen")+'</button>>
<</div>>
<</div>>
<<section class="section">>
<<h2>Informationen</h2>>
<<div class="card">'+(b.pageCount||"—")+' Seiten · '+esc(b.language||"Deutsch")+' · '+esc(b.format||"E-Book")+(b.publisher||b.publicationYear?'<p class="muted">'+esc(b.publisher||"")+(b.publicationYear?' · '+b.publicationYear:"")+'</p>':"")+'</div>>
<</section>>
<<section class="section">>
<<h2>Genres & Tropes</h2>>
<<div class="pillrow">'+[...(b.genres||[]),...(b.tropes||[])].map(x=>'<span class="pill">'+esc(x)+'</span>').join("")+'</div>>
<</section>>
<<section class="section">>
<<h2>Meine Rezension</h2>>
<<div class="card">'+(b.review?esc(b.review).replace(/\n/g,"<br>"):'<span class="muted">Keine Rezension.</span>')+'</div>>
<</section>>
<<section class="section">>
<<h2>Notizen</h2>>
<<div class="card">'+(b.notes?esc(b.notes).replace(/\n/g,"<br>"):'<span class="muted">Keine Notizen.</span>')+'</div>>
<</section>>
<<button class="btn danger" style="width:100%" data-a="delete">Buch löschen</button>>
<</main>'}
function field(id,l,v,t,req){return'<div class="field">>
<<label>'+esc(l)+(req?' *':'')+'</label>>
<<input id="'+id+'" class="input" type="'+(t||"text")+'" '+(req?'required':'')+' value="'+esc(v||"")+'">>
<</div>'}
function seg(l,id,v,o){return'<div class="field">>
<<label>'+l+'</label>>
<<div class="seg '+(o.length===3?'three':'')+'">'+o.map(x=>'<button type="button" class="'+(v===x[0]?'sel':'')+'" data-seg="'+id+'" data-val="'+x[0]+'">'+x[1]+'</button>').join("")+'</div>>
<<input id="'+id+'" type="hidden" value="'+esc(v||"")+'">>
<</div>'}
function chips(g,arr,sel){return'<div class="chips">'+arr.map(x=>'<button type="button" class="chip '+(sel.includes(x)?'selected':'')+'" data-chip="'+g+'" data-val="'+esc(x)+'">'+esc(x)+'</button>').join("")+'</div>'}
function form(id){let b=id?data.books.find(x=>x.id===id):{ownership:"owned",status:"unread",rating:0,favorite:false,purchaseStatus:"none",language:"Deutsch",format:"E-Book",genres:[],tropes:[],progress:0,currentPage:0};
if(!b)return library();
let seriesNames=[...new Set(data.books.map(x=>x.seriesName).filter(Boolean))].sort((a,c)=>a.localeCompare(c,"de"));
return'<main class="app">'+top(id?'Bearbeiten':'Buch hinzufügen',"Bibliothek")+'<form class="form" id="bookForm">>
<<div class="lookup">>
<<Mintgrünes Design · Reihen-Auswahl.</b>>
<<p class="muted" style="font-size:12px">ISBN eingeben → Buchdaten automatisch abrufen → prüfen → speichern.</p>>
<<div class="row">>
<<input id="isbnLookup" class="input grow" inputmode="numeric" placeholder="ISBN-10 oder ISBN-13">>
<<button type="button" class="btn primary" data-a="isbn">Abrufen</button>>
<</div>>
<<div id="isbnMsg" style="font-size:12px;margin-top:8px">>
<</div>>
<</div>>
<<div class="field">>
<<label>Cover</label>>
<<label class="btn" style="display:block;text-align:center">📷 Cover aus Fotos auswählen<input id="coverFile" type="file" accept="image/*" hidden>>
<</label>>
<<input id="cover" class="input" value="'+esc(b.cover||"")+'" placeholder="oder Bild-URL" style="margin-top:8px">>
<<div id="preview" style="margin-top:8px">'+(b.cover?'<img src="'+esc(b.cover)+'" style="width:75px;height:110px;object-fit:cover;
border-radius:9px">':"")+'</div>>
<</div>'+field("title","Titel",b.title,true)+field("author","Autor",b.author,true)+field("subtitle","Untertitel",b.subtitle)+field("isbn","ISBN",b.isbn)+'<div class="two">'+field("publisher","Verlag",b.publisher)+field("publicationYear","Erscheinungsjahr",b.publicationYear,"number")+'</div>>
<<div class="two">'+field("pageCount","Seitenzahl",b.pageCount,"number")+'<div class="field">>
<<label>Sprache</label>>
<<select id="language" class="select">'+["Deutsch","Englisch","Französisch","Spanisch","Andere"].map(x=>'<option '+(b.language===x?'selected':'')+'>'+x+'</option>').join("")+'</select>>
<</div>>
<</div>>
<<div class="field">>
<<label>Format</label>>
<<select id="format" class="select">'+["E-Book","Taschenbuch","Hardcover","Hörbuch","Sonstiges"].map(x=>'<option '+(b.format===x?'selected':'')+'>'+x+'</option>').join("")+'</select>>
<</div>'+seg("Besitzstatus","ownership",b.ownership,[["owned","🏠 Besitz"],["borrowed","🤝 Ausgeliehen"],["kindleUnlimited","📱 KU"]])+'<div class="two">'+field("borrowedFrom","Ausgeliehen von",b.borrowedFrom)+field("returnDue","Rückgabe",b.returnDue,"date")+'</div>>
<<div class="field">>
<<label>Reihe</label>>
<<select id="seriesName" class="select">>
<<option value="">Keine Reihe</option>'+seriesNames.map(x=>'<option value="'+esc(x)+'" '+(b.seriesName===x?'selected':'')+'>'+esc(x)+'</option>').join("")+'</select>>
<<input id="newSeries" class="input" placeholder="Oder neue Reihe anlegen" style="margin-top:8px">>
<</div>'+field("volume","Band",b.volume,"number")+'<div class="field">>
<<label>Genres</label>'+chips("genres",data.genres,b.genres||[])+'</div>>
<<div class="field">>
<<label>Tropes</label>'+chips("tropes",data.tropes,b.tropes||[])+'<input id="customTrope" class="input" placeholder="Eigenen Trope hinzufügen" style="margin-top:8px">>
<</div>'+seg("Lesestatus","status",b.status,[["unread","Ungelesen"],["reading","Reading"],["read","Gelesen"],["dnf","DNF"]])+'<div class="field">>
<<label>Bewertung</label>>

function collect(){let old=state.editingId?data.books.find(x=>x.id===state.editingId):null,b={...(old||{}),id:old?old.id:uid(),createdAt:old?.createdAt||new Date().toISOString(),updatedAt:new Date().toISOString()};["title","author","subtitle","isbn","publisher","publicationYear","pageCount","language","format","ownership","borrowedFrom","returnDue","seriesName","volume","status","rating","purchaseStatus","startedAt","finishedAt","currentPage","progress","review","notes","cover"].forEach(id=>{let e=document.getElementById(id);
if(e)b[id]=e.value});
let ns=document.getElementById("newSeries");
if(ns?.value.trim())b.seriesName=ns.value.trim();b.pageCount=+b.pageCount||0;b.publicationYear=+b.publicationYear||"";b.volume=+b.volume||0;b.currentPage=+b.currentPage||0;b.progress=Math.max(0,Math.min(100,+b.progress||0));b.rating=Math.max(0,Math.min(5,+b.rating||0));b.favorite=document.getElementById("fav").classList.contains("primary");b.genres=[...document.querySelectorAll('[data-chip="genres"].selected')].map(x=>x.dataset.val);b.tropes=[...document.querySelectorAll('[data-chip="tropes"].selected')].map(x=>x.dataset.val);
let ct=document.getElementById("customTrope");
if(ct?.value.trim()&&!b.tropes.includes(ct.value.trim()))b.tropes.push(ct.value.trim());
if(b.purchaseStatus==="purchased")b.ownership="owned";

return b}


function saveForm(){let f=document.getElementById("bookForm");

if(!f.checkValidity()){f.reportValidity();
return}let b=collect(),i=data.books.findIndex(x=>x.id===b.id);
if(i<0)data.books.unshift(b);
else data.books[i]=b;save();state.bookId=b.id;state.editingId=null;state.screen="detail";toast("Buch gespeichert");
render()}
function deleteBook(){let b=data.books.find(x=>x.id===state.bookId);

if(b&&confirm("„"+b.title+"“ wirklich löschen?")){data.books=data.books.filter(x=>x.id!==b.id);save();state.screen="library";state.bookId=null;
render()}}
function exportData(){let a=document.createElement("a");
a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));a.download="bookvault-backup.json";
a.click()}
document.addEventListener("click",e=>{let n=e.target.closest("[data-nav]");

if(n){let x=n.dataset.nav;state.screen=x==="add"?"form":x;state.editingId=null;render();
return}let o=e.target.closest("[data-open]");

if(o){state.bookId=o.dataset.open;state.screen="detail";render();
return}let s=e.target.closest("[data-series]");

if(s){state.seriesName=s.dataset.series;state.screen="seriesDetail";render();
return}let fl=e.target.closest("[data-filter]");

if(fl){state.filter=fl.dataset.filter;state.screen="library";render();
return}let sg=e.target.closest("[data-seg]");

if(sg){document.getElementById(sg.dataset.seg).value=sg.dataset.val;sg.parentElement.querySelectorAll("button").forEach(x=>x.classList.remove("sel"));sg.classList.add("sel");
return}let ch=e.target.closest("[data-chip]");

if(ch){ch.classList.toggle("selected");
return}let rt=e.target.closest("[data-rate]");

if(rt){let n=+rt.dataset.rate;
document.getElementById("rating").value=n;

document.querySelectorAll("[data-rate]").forEach((x,i)=>{x.classList.toggle("on",i<n);x.textContent=i<n?"★":"☆"});
return}let a=e.target.closest("[data-a]");
if(!a)return;
let x=a.dataset.a;
if(x==="home")state.screen="home";

else if(x==="edit"){state.editingId=state.bookId;state.screen="form"}else if(x==="delete")deleteBook();

else if(x==="fav"){let b=document.getElementById("fav"),on=b.classList.toggle("primary");b.textContent=on?"❤️ Favorit":"♡ Als Favorit markieren"}else if(x==="isbn")isbn();

else if(x==="cancel"){state.screen=state.bookId?"detail":"library";
state.editingId=null}else if(x==="view"){data.settings.view=data.settings.view==="grid"?"list":"grid";
save()}else if(x==="sort"){let v=prompt("Sortierung: added, title, author oder rating",data.settings.sort);

if(["added","title","author","rating"].includes(v)){data.settings.sort=v;
save()}}else if(x==="buy"){let b=data.books.find(x=>x.id===state.bookId);

if(b){b.purchaseStatus=b.purchaseStatus==="wanted"?"purchased":"wanted";
if(b.purchaseStatus==="purchased")b.ownership="owned";
save()}}else if(x==="wanted"){state.filter="wanted";state.screen="library"}else if(x==="export")exportData();

else if(x==="reset"&&confirm("Alle Daten löschen?")){localStorage.removeItem(KEY);data=load();state.screen="home"}render()});

toast("Backup importiert")}catch(x){alert("Ungültiges Backup.")}};r.readAsText(e.target.files[0])}});
